<html lang="en">

<script type="importmap">

<body>
<div id="drop-overlay">Drop Any PNG/JPG Image Here to Test</div>
<div id="panel"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRButton } from "three/addons/webxr/VRButton.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import {
  SHAPE_PAGES,
  findShapeById,
  sampleImageToDrones,
  GOLDEN
} from "./shapes.js?v=samhain_final_suite_v20";

function formatTime(s) {
  if (isNaN(s) || s === undefined || s === null) return "00:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

const MAX_DRONES = 2000;
let activeDroneCount = 800;
let TOTAL_DURATION = 160.0;
const BASE_DRONE_SIZE = 0.48;

let takeoffConfig = { dur: 10.0, style: "celtic_whirl" };
let landingConfig = { dur: 24.0, style: "climactic_helix" };

let precipConfig = {
  enabled: true,
  type: "snow",
  count: 60,
  speed: 2.2,
  angle: 18.0,
  fx: "glimmer",
  color: "#ff6d00"
};

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 16, 52);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
renderer.xr.setFoveation(0.0);

document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const xrRig = new THREE.Group();
scene.add(xrRig);
xrRig.add(camera);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 14, 0);
orbit.update();

const stageGroup = new THREE.Group();
scene.add(stageGroup);

scene.add(new THREE.HemisphereLight(0xffb300, 0x0a101a, 1.2));
const gridHelper = new THREE.GridHelper(90, 45, 0x422915, 0x14100c);
stageGroup.add(gridHelper);

const launchPadGeom = new THREE.CircleGeometry(18, 32);
const launchPadMat = new THREE.MeshBasicMaterial({ color: 0x140c06, side: THREE.DoubleSide });
const launchPadMesh = new THREE.Mesh(launchPadGeom, launchPadMat);
launchPadMesh.rotation.x = -Math.PI / 2;
launchPadMesh.position.y = 0.05;
stageGroup.add(launchPadMesh);

const glowCanvas = document.createElement("canvas");
glowCanvas.width = 64; glowCanvas.height = 64;
const glowCtx = glowCanvas.getContext("2d");
const grad = glowCtx.createRadialGradient(32, 32, 1, 32, 32, 32);
grad.addColorStop(0, "rgba(255,255,255,1)");
grad.addColorStop(0.25, "rgba(255,220,180,0.9)");
grad.addColorStop(0.6, "rgba(255,140,0,0.2)");
grad.addColorStop(1, "rgba(255,100,0,0)");
glowCtx.fillStyle = grad;
glowCtx.fillRect(0, 0, 64, 64);
const glowTexture = new THREE.CanvasTexture(glowCanvas);
glowTexture.colorSpace = THREE.SRGBColorSpace;

const currentPositions = new Float32Array(MAX_DRONES * 3);
const targetPositions = new Float32Array(MAX_DRONES * 3);
const velocities = new Float32Array(MAX_DRONES * 3);
const currentColors = new Float32Array(MAX_DRONES * 3);
const targetColors = new Float32Array(MAX_DRONES * 3);
const droneSwatchIndices = new Uint8Array(MAX_DRONES);

const groundPositions = new Float32Array(MAX_DRONES * 3);
function updateGroundPositions(n) {
  for (let i = 0; i < n; i++) {
    const r = Math.sqrt((i + 0.5) / n) * 15.5;
    const theta = i * GOLDEN;
    groundPositions[i * 3]     = Math.cos(theta) * r;
    groundPositions[i * 3 + 1] = 0.12;
    groundPositions[i * 3 + 2] = Math.sin(theta) * r;
  }
}
updateGroundPositions(activeDroneCount);

const precipPositions = new Float32Array(MAX_DRONES * 3);
const precipDriftSeeds = new Float32Array(MAX_DRONES);
function initPrecipPositions() {
  for (let i = 0; i < MAX_DRONES; i++) {
    precipPositions[i * 3]     = (Math.random() - 0.5) * 36;
    precipPositions[i * 3 + 1] = 1.5 + Math.random() * 30;
    precipPositions[i * 3 + 2] = (Math.random() - 0.5) * 36;
    precipDriftSeeds[i]        = Math.random() * Math.PI * 2;
  }
}
initPrecipPositions();

for (let i = 0; i < MAX_DRONES; i++) {
  currentPositions[i * 3]     = groundPositions[i * 3];
  currentPositions[i * 3 + 1] = groundPositions[i * 3 + 1];
  currentPositions[i * 3 + 2] = groundPositions[i * 3 + 2];
  targetPositions[i * 3]      = currentPositions[i * 3];
  targetPositions[i * 3 + 1]  = currentPositions[i * 3 + 1];
  targetPositions[i * 3 + 2]  = currentPositions[i * 3 + 2];
}

const droneGeometry = new THREE.BufferGeometry();
droneGeometry.setAttribute("position", new THREE.BufferAttribute(currentPositions, 3));
droneGeometry.setAttribute("color", new THREE.BufferAttribute(currentColors, 3));
droneGeometry.setDrawRange(0, activeDroneCount);

const dronePoints = new THREE.Points(
  droneGeometry,
  new THREE.PointsMaterial({
    size: BASE_DRONE_SIZE,
    map: glowTexture,
    vertexColors: true,
    transparent: true,
    alphaTest: 0.05,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
stageGroup.add(dronePoints);

function assignMinimalPaths(currentPos, rawTargets, rawSwatches, count) {
  const assigned = new Float32Array(count * 3);
  const assignedSwatches = new Uint8Array(count);
  const unassigned = new Set();
  for (let i = 0; i < count; i++) unassigned.add(i);

  for (let i = 0; i < count; i++) {
    const cx = currentPos[i * 3], cy = currentPos[i * 3 + 1], cz = currentPos[i * 3 + 2];
    let closest = -1, minD = Infinity;
    for (const tIdx of unassigned) {
      const tx = rawTargets[tIdx * 3], ty = rawTargets[tIdx * 3 + 1], tz = rawTargets[tIdx * 3 + 2];
      const d = (cx - tx) ** 2 + (cy - ty) ** 2 + (cz - tz) ** 2;
      if (d < minD) { minD = d; closest = tIdx; }
    }
    unassigned.delete(closest);
    assigned[i * 3]     = rawTargets[closest * 3];
    assigned[i * 3 + 1] = rawTargets[closest * 3 + 1];
    assigned[i * 3 + 2] = rawTargets[closest * 3 + 2];
    if (rawSwatches) {
      assignedSwatches[i] = rawSwatches[closest];
    }
  }
  return { positions: assigned, swatches: assignedSwatches };
}

const SHOW_SCENES = [
  { tNum: 16, palette: ["#ffd54f", "#8d4e28"], motion: "vortex", colorFX: "sparkle" },
  { tNum: 25, palette: ["#cfd8dc", "#5d4037"], motion: "cascade_wave", colorFX: "fire_burst" },
  { tNum: 28, palette: ["#d50000", "#8d4e28"], motion: "torus_warp", colorFX: "mystic_aurora" },
  { tNum: 26, palette: ["#5d4037", "#8d6e63"], motion: "explosion", colorFX: "beacon" },
  { tNum: 27, palette: ["#ffffff", "#ffab00", "#5d4037"], motion: "hourglass_twist", colorFX: "fire_burst" },
  { tNum: 18, palette: ["#ff6d00"], motion: "celtic_swirl", colorFX: "sparkle" },
  { tNum: 24, palette: ["#ffffff", "#ff3d00", "#ffd600"], motion: "quantum_scatter", colorFX: "fire_burst" },
  { tNum: 19, palette: ["#ffffff"], motion: "helix", colorFX: "mystic_aurora" },
  { tNum: 32, palette: ["#ffd700", "#ffb300"], motion: "vortex", colorFX: "sparkle" },
  { tNum: 29, palette: ["#00e676", "#00b0ff"], motion: "torus_warp", colorFX: "beacon" },
  { tNum: 30, palette: ["#ff1744", "#d50000"], motion: "cascade_wave", colorFX: "fire_burst" },
  { tNum: 31, palette: ["#ffd54f", "#ff9100"], motion: "hourglass_twist", colorFX: "sparkle" },
  { tNum: 33, palette: ["#e040fb", "#ffd54f"], motion: "explosion", colorFX: "beacon" },
  { tNum: 34, palette: ["#7c4dff", "#00e5ff"], motion: "quantum_scatter", colorFX: "mystic_aurora" },
  { tNum: 17, palette: ["#ffffff", "#ffd54f", "#ff6d00", "#d50000"], motion: "vortex", colorFX: "fire_burst", isLast: true }
];

const timelineData = {
  formationBlocks: SHOW_SCENES.map((sc, idx) => ({
    id: `s_${idx}`,
    shapeId: `samhainTile${sc.tNum}`,
    tileNum: sc.tNum,
    isText: false,
    dur: sc.isLast ? 10.0 : 5.0,
    transDur: sc.isLast ? 0.0 : 4.0,
    transMotion: sc.motion,
    transColorFX: sc.colorFX,
    altitude: 16.0,
    scale: 1.0,
    rotStartY: 0,
    rotEndY: 0,
    palette: sc.palette,
    activeSwatchIdx: 0,
    cycleSpeed: 0.5,
    run: (idx % 2 === 0),
    runSpeed: 3.5,
    blink: false,
    blinkSpeed: 3.0,
    sparkle: true,
    sparkleDensity: 0.35
  }))
};

let formationTrajectories = [];
let formationSwatchStore = [];

async function buildShowTrajectoryData() {
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;
  formationTrajectories = [];
  formationSwatchStore = [];

  let prevSlots = groundPositions;

  for (let i = 0; i < timelineData.formationBlocks.length; i++) {
    const b = timelineData.formationBlocks[i];
    const raw = new Float32Array(formationCount * 3);
    const swatches = new Uint8Array(formationCount);

    const shape = findShapeById(b.shapeId);
    if (shape) await shape.gen(raw, formationCount, swatches);

    const result = assignMinimalPaths(prevSlots, raw, swatches, formationCount);
    formationTrajectories.push(result.positions);
    formationSwatchStore.push(result.swatches);
    prevSlots = result.positions;
  }
}

function recalculateTimelineDuration() {
  let formTotal = 0;
  for (const b of timelineData.formationBlocks) formTotal += b.dur + (b.transDur || 0);
  TOTAL_DURATION = takeoffConfig.dur + Math.max(formTotal, 20.0) + landingConfig.dur;
}
recalculateTimelineDuration();

let playheadTime = 0.0;
const PRE_SHOW_DELAY = 10.0;
const POST_SHOW_DELAY = 10.0;
let showState = "PRE_SHOW";
let pauseCountdown = PRE_SHOW_DELAY;

const tempColor = new THREE.Color();
const prevBlockColor = new THREE.Color();
const nextBlockColor = new THREE.Color();

function applyLightingFX(block, timeSec) {
  const pal = block.palette || ["#ffffff"];
  const nColors = pal.length;
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;

  for (let i = 0; i < formationCount; i++) {
    let r = 1, g = 1, b = 1;
    const swatchIdx = droneSwatchIndices[i] % nColors;
    tempColor.set(pal[swatchIdx]);
    r = tempColor.r; g = tempColor.g; b = tempColor.b;

    if (block.run) {
      const wave = Math.sin(timeSec * block.runSpeed - (i / formationCount) * 8.0);
      if (wave > 0.3) { r = Math.min(1, r * 1.35); g = Math.min(1, g * 1.35); b = Math.min(1, b * 1.35); }
    }
    if (block.blink) {
      const on = Math.sin(timeSec * Math.PI * 2 * block.blinkSpeed) > 0;
      const factor = on ? 1.0 : 0.08;
      r *= factor; g *= factor; b *= factor;
    }
    if (block.sparkle && Math.sin(i * 127.1 + timeSec * 16.0) > (1.0 - block.sparkleDensity * 0.8)) {
      r = 1.0; g = 1.0; b = 1.0;
    }

    targetColors[i * 3]     = r;
    targetColors[i * 3 + 1] = g;
    targetColors[i * 3 + 2] = b;
  }
}

const rotEuler = new THREE.Euler(0, 0, 0, "YXZ");
const rotMatrix = new THREE.Matrix4();
const centerPt = new THREE.Vector3(0, 16, 0);

function transformToSky(x, y, z, altitude, scale, angleY, outVec) {
  rotEuler.set(0, angleY, 0);
  rotMatrix.makeRotationFromEuler(rotEuler);
  centerPt.set(0, altitude, 0);

  outVec.set(
    x * scale,
    (y - 16) * scale + altitude,
    z * scale
  );
  outVec.sub(centerPt);
  outVec.applyMatrix4(rotMatrix);
  outVec.add(centerPt);
  outVec.y = Math.max(0.12, outVec.y);
}

const skyPosA = new THREE.Vector3();
const skyPosB = new THREE.Vector3();
const localScratchPoints = new Float32Array(MAX_DRONES * 3);

function evaluateTimeline(t) {
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;
  const showBodyEnd = TOTAL_DURATION - landingConfig.dur;
  if (formationTrajectories.length === 0) return;

  // 1. Takeoff Phase
  if (t <= takeoffConfig.dur) {
    const u = Math.max(0, t / takeoffConfig.dur);
    const firstTargets = formationTrajectories[0];
    const firstSwatches = formationSwatchStore[0];
    const b0 = timelineData.formationBlocks[0];
    const alt = b0.altitude || 16.0;
    const scl = b0.scale || 1.0;
    const v0y = THREE.MathUtils.degToRad(b0.rotStartY || 0);

    for (let i = 0; i < formationCount; i++) {
      const gx = groundPositions[i * 3];
      const gy = groundPositions[i * 3 + 1];
      const gz = groundPositions[i * 3 + 2];

      transformToSky(firstTargets[i * 3], firstTargets[i * 3 + 1], firstTargets[i * 3 + 2], alt, scl, v0y, skyPosA);

      const ease = u * u * (3 - 2 * u);

      targetPositions[i * 3]     = gx + (skyPosA.x - gx) * ease;
      targetPositions[i * 3 + 1] = gy + (skyPosA.y - gy) * ease;
      targetPositions[i * 3 + 2] = gz + (skyPosA.z - gz) * ease;

      if (firstSwatches) droneSwatchIndices[i] = firstSwatches[i];

      const hue = (u * 0.3 + (i % 30) / 30 * 0.15) % 1.0;
      tempColor.setHSL(hue > 0.2 ? 0.08 : 0.5, 1.0, 0.6);
      targetColors[i * 3]     = tempColor.r * (0.3 + 0.7 * ease);
      targetColors[i * 3 + 1] = tempColor.g * (0.3 + 0.7 * ease);
      targetColors[i * 3 + 2] = tempColor.b * (0.3 + 0.7 * ease);
    }
  }
  // 2. Main Formation Blocks & Transitions
  else if (t > takeoffConfig.dur && t < showBodyEnd) {
    const showT = t - takeoffConfig.dur;
    let curT = 0;

    for (let i = 0; i < timelineData.formationBlocks.length; i++) {
      const b = timelineData.formationBlocks[i];
      const formStart = curT, formEnd = curT + b.dur, transEnd = formEnd + (b.transDur || 0);
      const currTargets = formationTrajectories[i];
      const currSwatches = formationSwatchStore[i];

      const alt = b.altitude || 16.0;
      const scl = b.scale || 1.0;
      const v0y = THREE.MathUtils.degToRad(b.rotStartY || 0);
      const v1y = THREE.MathUtils.degToRad(b.rotEndY || 0);

      if (showT >= formStart && showT < formEnd) {
        const uBlock = (showT - formStart) / b.dur;
        const curRotY = v0y + (v1y - v0y) * uBlock;
        const tScene = showT - formStart;
        const env = Math.sin(Math.PI * uBlock); // Smooth envelope: guarantees 0 at start and end of scene

        localScratchPoints.set(currTargets.subarray(0, formationCount * 3));

        if (b.tileNum === 16) {
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            const px = localScratchPoints[j * 3];
            const yNorm = Math.max(0, Math.min(1, (py - 8) / 16));
            const sway = (Math.sin(tScene * 2.2 + px * 0.25) * 1.5 + Math.sin(tScene * 4.5) * 0.4) * Math.pow(yNorm, 1.6);
            localScratchPoints[j * 3] += sway * env;
            localScratchPoints[j * 3 + 1] -= Math.abs(sway) * 0.12 * yNorm * env;
          }
        } else if (b.tileNum === 25) {
          const swingPhase = uBlock * Math.PI * 4.0; // Exactly 2 complete cutting strokes
          const cutMotion = Math.sin(swingPhase) * 0.65;
          const cosCut = Math.cos(cutMotion), sinCut = Math.sin(cutMotion);

          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3];
            const ly = localScratchPoints[j * 3 + 1] - 8.0;
            localScratchPoints[j * 3]     = lx * cosCut - ly * sinCut;
            localScratchPoints[j * 3 + 1] = 8.0 + (lx * sinCut + ly * cosCut);
          }
        } else if (b.tileNum === 28) {
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            const flutter = Math.sin(tScene * 3.5 + py * 0.4) * 0.8 * env;
            localScratchPoints[j * 3] += flutter;
            localScratchPoints[j * 3 + 2] += Math.cos(tScene * 3.0 + py * 0.3) * 0.6 * env;
          }
        } else if (b.tileNum === 26) {
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            if (py > 15.5) {
              const yNorm = Math.max(0, (py - 15.5) / 10.0);
              localScratchPoints[j * 3] += Math.sin(tScene * 2.2 + py * 0.25) * (yNorm * 0.7) * env;
            }
          }
        } else if (b.tileNum === 27) {
          const rockAngle = Math.sin(uBlock * Math.PI * 4.0) * 0.14; // Exactly 2 complete rocks
          const pivotY = 10.0;
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            if (py > 10.5) {
              const factor = Math.min(1.0, (py - 10.5) / 10.0);
              const angle = rockAngle * factor;
              const ca = Math.cos(angle), sa = Math.sin(angle);
              const lx = localScratchPoints[j * 3];
              const ly = py - pivotY;
              localScratchPoints[j * 3]     = lx * ca - ly * sa;
              localScratchPoints[j * 3 + 1] = pivotY + (lx * sa + ly * ca);
            }
          }
        } else if (b.tileNum === 18) {
          const wobblePulse = Math.sin(uBlock * Math.PI * 4.0) * 0.055; // 2 complete pulses
          const wobbleX = 1.0 + wobblePulse;
          const wobbleY = 1.0 - wobblePulse;
          for (let j = 0; j < formationCount; j++) {
            localScratchPoints[j * 3]     *= wobbleX;
            localScratchPoints[j * 3 + 1] = alt + (localScratchPoints[j * 3 + 1] - alt) * wobbleY;
          }
        } else if (b.tileNum === 24) {
          for (let j = 0; j < formationCount; j++) {
            if (currSwatches && currSwatches[j] === 1) {
              const py = localScratchPoints[j * 3 + 1];
              localScratchPoints[j * 3] += Math.sin(tScene * 5.5 + py * 1.5) * 0.45 * env;
            }
          }
        } else if (b.tileNum === 19) {
          const floatY = Math.sin(uBlock * Math.PI * 2.0) * 0.8;
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            localScratchPoints[j * 3 + 1] += floatY;
            localScratchPoints[j * 3] += Math.sin(tScene * 2.5 + py * 0.3) * 0.5 * env;
          }
        } else if (b.tileNum === 32) {
          const wobble = Math.sin(uBlock * Math.PI * 2.0) * 0.08;
          const cosW = Math.cos(wobble), sinW = Math.sin(wobble);
          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3];
            const ly = localScratchPoints[j * 3 + 1] - alt;
            localScratchPoints[j * 3]     = lx * cosW - ly * sinW;
            localScratchPoints[j * 3 + 1] = alt + (lx * sinW + ly * cosW);
          }
        } else if (b.tileNum === 29 || b.tileNum === 30) {
          const dir = b.tileNum === 29 ? 1 : -1;
          const spinA = uBlock * Math.PI * 2.0 * dir; // Exactly 1 full 360-degree rotation
          const cosS = Math.cos(spinA), sinS = Math.sin(spinA);
          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3];
            const ly = localScratchPoints[j * 3 + 1] - alt;
            localScratchPoints[j * 3]     = lx * cosS - ly * sinS;
            localScratchPoints[j * 3 + 1] = alt + (lx * sinS + ly * cosS);
          }
        } else if (b.tileNum === 31 || b.tileNum === 34) {
          const spinA = uBlock * Math.PI * 2.0; // Exactly 1 full 360-degree rotation
          const cosS = Math.cos(spinA), sinS = Math.sin(spinA);
          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3];
            const ly = localScratchPoints[j * 3 + 1] - alt;
            localScratchPoints[j * 3]     = lx * cosS - ly * sinS;
            localScratchPoints[j * 3 + 1] = alt + (lx * sinS + ly * cosS);
          }
        }

        for (let j = 0; j < formationCount; j++) {
          transformToSky(localScratchPoints[j * 3], localScratchPoints[j * 3 + 1], localScratchPoints[j * 3 + 2], alt, scl, curRotY, skyPosA);
          targetPositions[j * 3]     = skyPosA.x;
          targetPositions[j * 3 + 1] = skyPosA.y;
          targetPositions[j * 3 + 2] = skyPosA.z;
          if (currSwatches) droneSwatchIndices[j] = currSwatches[j];
        }

        applyLightingFX(b, t);
        break;
      } else if (showT >= formEnd && showT < transEnd) {
        const nextIdx = (i + 1 < timelineData.formationBlocks.length) ? i + 1 : 0;
        const nextB = timelineData.formationBlocks[nextIdx];
        const nextTargets = formationTrajectories[nextIdx];
        const nextSwatches = formationSwatchStore[nextIdx];

        const progress = (showT - formEnd) / b.transDur;
        const ease = progress * progress * (3 - 2 * progress);
        const arc = Math.sin(Math.PI * progress);

        const nextAlt = nextB.altitude || 16.0;
        const nextScl = nextB.scale || 1.0;
        const interpAlt = alt + (nextAlt - alt) * ease;
        const interpScl = scl + (nextScl - scl) * ease;

        const nextV0y = THREE.MathUtils.degToRad(nextB.rotStartY || 0);
        const curRotY = v1y + (nextV0y - v1y) * ease;

        localScratchPoints.set(currTargets.subarray(0, formationCount * 3));
        const motionStyle = b.transMotion || "vortex";

        for (let j = 0; j < formationCount; j++) {
          transformToSky(localScratchPoints[j * 3], localScratchPoints[j * 3 + 1], localScratchPoints[j * 3 + 2], interpAlt, interpScl, curRotY, skyPosA);
          transformToSky(nextTargets[j * 3], nextTargets[j * 3 + 1], nextTargets[j * 3 + 2], interpAlt, interpScl, curRotY, skyPosB);

          let midX = skyPosA.x + (skyPosB.x - skyPosA.x) * ease;
          let midY = skyPosA.y + (skyPosB.y - skyPosA.y) * ease;
          let midZ = skyPosA.z + (skyPosB.z - skyPosA.z) * ease;

          if (motionStyle === "vortex") {
            const distFromCenter = Math.sqrt(midX * midX + (midY - interpAlt) * (midY - interpAlt));
            const baseAngle = Math.atan2(midY - interpAlt, midX);
            const spinAngle = baseAngle + progress * (Math.PI * 2.22);
            const expandRadius = distFromCenter * (1.0 + arc * 0.38);

            midX = Math.cos(spinAngle) * expandRadius;
            midY = interpAlt + Math.sin(spinAngle) * expandRadius;
            midZ += Math.sin(j * 0.15 + progress * Math.PI * 2.0) * (arc * 4.5);
          } else if (motionStyle === "explosion") {
            const dirX = midX;
            const dirY = midY - interpAlt;
            const len = Math.max(0.1, Math.sqrt(dirX * dirX + dirY * dirY));
            const blast = arc * 14.0 * (0.8 + (j % 12) * 0.035);

            midX += (dirX / len) * blast;
            midY += (dirY / len) * blast;
            midZ += (Math.sin(j * 37.1) * 2.0 - 1.0) * (arc * 7.5);
          } else if (motionStyle === "celtic_swirl") {
            const ribbonPhase = (j / formationCount) * Math.PI * 4.0;
            const wave = Math.sin(progress * Math.PI * 2.0 + ribbonPhase);
            midX += Math.cos(ribbonPhase + progress * Math.PI) * (arc * 8.5);
            midY += wave * (arc * 5.0);
            midZ += Math.sin(progress * Math.PI * 3.0 + (j % 5)) * (arc * 7.0);
          } else if (motionStyle === "helix") {
            const helixAngle = progress * Math.PI * 2.4 + (j % 24) * (Math.PI / 12);
            const r = 9.5 * arc;
            midX += Math.cos(helixAngle) * r;
            midY += Math.sin(helixAngle) * (arc * 4.0);
            midZ += Math.sin(helixAngle) * r;
          } else if (motionStyle === "torus_warp") {
            const uTorus = (j / formationCount) * Math.PI * 2.0 + progress * Math.PI * 2.0;
            const vTorus = progress * Math.PI * 3.0 + (j % 10) * 0.6;
            const R = 12.0 * arc;
            const r = 4.5 * arc;
            midX += (R + r * Math.cos(vTorus)) * Math.cos(uTorus) * 0.65;
            midY += r * Math.sin(vTorus) * 0.65;
            midZ += (R + r * Math.cos(vTorus)) * Math.sin(uTorus) * 0.65;
          } else if (motionStyle === "hourglass_twist") {
            const pinchFactor = 1.0 - arc * 0.82;
            const twistAngle = (midY - interpAlt) * 0.15 * arc * Math.PI;
            const cosT = Math.cos(twistAngle), sinT = Math.sin(twistAngle);
            const px = midX * pinchFactor;
            const pz = midZ * pinchFactor;
            midX = px * cosT - pz * sinT;
            midZ = px * sinT + pz * cosT;
          } else if (motionStyle === "quantum_scatter") {
            const scatterSeed = j * 41.7 + progress * 8.0;
            const scatterDist = arc * 11.5;
            midX += Math.sin(scatterSeed) * scatterDist;
            midY += Math.cos(scatterSeed * 1.3) * (scatterDist * 0.7);
            midZ += Math.sin(scatterSeed * 1.7) * scatterDist;
          } else if (motionStyle === "cascade_wave") {
            const waveX = (midX + 20.0) / 40.0;
            const wavePhase = progress * Math.PI * 2.5 - waveX * Math.PI * 2.0;
            const crest = Math.sin(wavePhase);
            midY += crest * (arc * 7.5);
            midZ += Math.cos(wavePhase) * (arc * 6.0);
          }

          targetPositions[j * 3]     = midX;
          targetPositions[j * 3 + 1] = Math.max(0.5, midY);
          targetPositions[j * 3 + 2] = midZ;

          if (ease > 0.5 && nextSwatches) droneSwatchIndices[j] = nextSwatches[j];
          else if (currSwatches) droneSwatchIndices[j] = currSwatches[j];
        }

        const palA = b.palette || ["#ffffff"];
        const palB = nextB.palette || ["#ffffff"];

        for (let j = 0; j < formationCount; j++) {
          const swatchA = currSwatches ? (currSwatches[j] % palA.length) : 0;
          const swatchB = nextSwatches ? (nextSwatches[j] % palB.length) : 0;
          prevBlockColor.set(palA[swatchA]);
          nextBlockColor.set(palB[swatchB]);

          tempColor.lerpColors(prevBlockColor, nextBlockColor, ease);

          if (b.transColorFX === "sparkle") {
            const sparkle = Math.sin(t * 22.0 + j * 9.0) > 0.2 ? 1.0 : 0.15;
            tempColor.r = THREE.MathUtils.lerp(tempColor.r, sparkle, arc * 0.6);
            tempColor.g = THREE.MathUtils.lerp(tempColor.g, sparkle * 0.85, arc * 0.6);
            tempColor.b = THREE.MathUtils.lerp(tempColor.b, sparkle * 0.4, arc * 0.6);
          } else if (b.transColorFX === "fire_burst") {
            const burst = (Math.sin(t * 18.0 + (j % 20)) > 0.3) ? 1.0 : 0.2;
            tempColor.r = THREE.MathUtils.lerp(tempColor.r, 1.0, arc * 0.7);
            tempColor.g = THREE.MathUtils.lerp(tempColor.g, burst * 0.65, arc * 0.7);
            tempColor.b = THREE.MathUtils.lerp(tempColor.b, 0.05, arc * 0.7);
          } else if (b.transColorFX === "mystic_aurora") {
            const hue = (progress * 0.6 + (j / formationCount) * 0.4) % 1.0;
            const auroraCol = new THREE.Color().setHSL(hue, 1.0, 0.55);
            tempColor.lerp(auroraCol, arc * 0.75);
          }

          targetColors[j * 3]     = tempColor.r;
          targetColors[j * 3 + 1] = tempColor.g;
          targetColors[j * 3 + 2] = tempColor.b;
        }
        break;
      }
      curT = transEnd;
    }
  }
  // 3. Finale Undulating Swarm & Helix Landing (Unified continuous curve - zero jumps)
  else {
    const landT = t - showBodyEnd;
    const u = THREE.MathUtils.clamp(landT / landingConfig.dur, 0, 1);
    const lastTargets = formationTrajectories[formationTrajectories.length - 1];
    const lastB = timelineData.formationBlocks[timelineData.formationBlocks.length - 1];
    const alt = lastB.altitude || 16.0;
    const scl = lastB.scale || 1.0;
    const v1y = THREE.MathUtils.degToRad(lastB.rotEndY || 0);

    // Expand into swarm during 0 <= u <= 0.35
    const uExpand = Math.min(1.0, u / 0.35);
    const easeExpand = uExpand * uExpand * (3 - 2 * uExpand);

    // Descend to pad during 0.35 <= u <= 1.0
    const uDesc = Math.max(0.0, (u - 0.35) / 0.65);
    const easeDesc = uDesc * uDesc * (3 - 2 * uDesc);

    for (let i = 0; i < formationCount; i++) {
      const gx = groundPositions[i * 3];
      const gy = groundPositions[i * 3 + 1];
      const gz = groundPositions[i * 3 + 2];

      transformToSky(lastTargets[i * 3], lastTargets[i * 3 + 1], lastTargets[i * 3 + 2], alt, scl, v1y, skyPosA);

      // Spherical harmonic swarm
      const phi = Math.acos(1.0 - 2.0 * ((i + 0.5) / formationCount));
      const theta = i * GOLDEN + landT * 1.6;
      const rSwarm = 22.0 + Math.sin(landT * 3.0 + i * 0.15) * 5.0 + Math.sin(landT * 6.0 + theta * 2.0) * 3.0;

      const swarmX = Math.sin(phi) * Math.cos(theta) * rSwarm;
      const swarmY = alt + Math.cos(phi) * (rSwarm * 0.72) + Math.sin(landT * 4.0 + theta) * 2.2;
      const swarmZ = Math.sin(phi) * Math.sin(theta) * rSwarm;

      // Active swarm coordinate expanding from resting shape
      const curSwarmX = THREE.MathUtils.lerp(skyPosA.x, swarmX, easeExpand);
      const curSwarmY = THREE.MathUtils.lerp(skyPosA.y, swarmY, easeExpand);
      const curSwarmZ = THREE.MathUtils.lerp(skyPosA.z, swarmZ, easeExpand);

      // Helical funnel offset that gracefully vanishes as drones land
      const spiralAngle = (1.0 - easeDesc) * Math.PI * 4.0 + (i % 3) * (Math.PI * 2 / 3);
      const spiralRadius = Math.sin(Math.PI * easeDesc) * 8.0;

      const curX = THREE.MathUtils.lerp(curSwarmX, gx, easeDesc) + Math.cos(spiralAngle) * spiralRadius;
      const curY = THREE.MathUtils.lerp(curSwarmY, gy, easeDesc);
      const curZ = THREE.MathUtils.lerp(curSwarmZ, gz, easeDesc) + Math.sin(spiralAngle) * spiralRadius;

      targetPositions[i * 3]     = curX;
      targetPositions[i * 3 + 1] = Math.max(0.12, curY);
      targetPositions[i * 3 + 2] = curZ;

      const hueShift = (landT * 0.4 + (i / formationCount) * 0.6) % 1.0;
      tempColor.setHSL(hueShift, 1.0, 0.58);

      const isSparkleStar = (Math.sin(landT * 18.0 + i * 13.7) > 0.60);
      if (isSparkleStar && easeDesc < 0.8) {
        targetColors[i * 3]     = 1.0;
        targetColors[i * 3 + 1] = 1.0;
        targetColors[i * 3 + 2] = 1.0;
      } else {
        const emberPulse = Math.sin(t * 6.0 + i) > 0.4 ? 1.0 : 0.4;
        targetColors[i * 3]     = THREE.MathUtils.lerp(tempColor.r, emberPulse, easeDesc);
        targetColors[i * 3 + 1] = THREE.MathUtils.lerp(tempColor.g, emberPulse * 0.5, easeDesc);
        targetColors[i * 3 + 2] = THREE.MathUtils.lerp(tempColor.b, 0.05, easeDesc);
      }
    }
  }

  // 4. Atmospheric Precipitation
  if (precipConfig.enabled) {
    const precipHex = new THREE.Color(precipConfig.color);

    for (let i = formationCount; i < activeDroneCount; i++) {
      const gx = groundPositions[i * 3];
      const gy = groundPositions[i * 3 + 1];
      const gz = groundPositions[i * 3 + 2];
      const px = precipPositions[i * 3];
      const py = precipPositions[i * 3 + 1];
      const pz = precipPositions[i * 3 + 2];

      if (t <= takeoffConfig.dur) {
        const u = Math.max(0, t / takeoffConfig.dur);
        const ease = u * u * (3 - 2 * u);
        targetPositions[i * 3]     = gx + (px - gx) * ease;
        targetPositions[i * 3 + 1] = gy + (py - gy) * ease;
        targetPositions[i * 3 + 2] = gz + (pz - gz) * ease;
        targetColors[i * 3]     = precipHex.r * 0.4 * ease;
        targetColors[i * 3 + 1] = precipHex.g * 0.4 * ease;
        targetColors[i * 3 + 2] = precipHex.b * 0.4 * ease;
      } else if (t > takeoffConfig.dur && t < showBodyEnd) {
        targetPositions[i * 3]     = px;
        targetPositions[i * 3 + 1] = py;
        targetPositions[i * 3 + 2] = pz;
        const brightness = Math.sin(t * 8.0 + precipDriftSeeds[i] * 5.0) > 0.4 ? 1.0 : 0.65;
        targetColors[i * 3]     = precipHex.r * brightness;
        targetColors[i * 3 + 1] = precipHex.g * brightness;
        targetColors[i * 3 + 2] = precipHex.b * brightness;
      } else {
        const u = THREE.MathUtils.clamp((t - showBodyEnd) / landingConfig.dur, 0, 1);
        const ease = u * u * (3 - 2 * u);
        targetPositions[i * 3]     = px + (gx - px) * ease;
        targetPositions[i * 3 + 1] = py + (gy - py) * ease;
        targetPositions[i * 3 + 2] = pz + (gz - pz) * ease;
        targetColors[i * 3]     = precipHex.r * (1 - ease * 0.8);
        targetColors[i * 3 + 1] = precipHex.g * (1 - ease * 0.8);
        targetColors[i * 3 + 2] = 0.05;
      }
    }
  }
}

// -------------------------------------------------------------
// PHYSICS-BASED GLB EXPORTER (ZERO TELEPORTS / PERFECT CONTINUITY)
// -------------------------------------------------------------
window.bakeAndDownloadGLB = function() {
  console.log("Simulating 60Hz physics and baking GLB... please wait.");

  const root = new THREE.Group();
  root.name = "SamhainDroneFleet";

  const sphereGeom = new THREE.SphereGeometry(0.25, 8, 6);
  const droneMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  for (let i = 0; i < activeDroneCount; i++) {
    const drone = new THREE.Mesh(sphereGeom, droneMat);
    drone.name = `Drone_${i}`;
    root.add(drone);
  }

  const SPRING = 7.5;
  const DAMPING = 4.0;
  const MAX_DRONE_SPEED = 8.5;

  const simPositions = new Float32Array(activeDroneCount * 3);
  const simVelocities = new Float32Array(activeDroneCount * 3);
  simPositions.set(groundPositions.subarray(0, activeDroneCount * 3));

  const sampleFPS = 15;
  const totalFrames = Math.floor(TOTAL_DURATION * sampleFPS);
  const times = new Float32Array(totalFrames);
  for (let f = 0; f < totalFrames; f++) times[f] = f / sampleFPS;

  const positions = Array.from({ length: activeDroneCount }, () => new Float32Array(totalFrames * 3));

  const physicsSubsteps = 4; // 15 FPS * 4 = 60 Hz physics
  const dt = (1 / sampleFPS) / physicsSubsteps;
  const totalSubsteps = totalFrames * physicsSubsteps;
  let frameIdx = 0;

  for (let s = 0; s < totalSubsteps; s++) {
    const simTime = s * dt;
    evaluateTimeline(simTime);

    for (let i = 0; i < activeDroneCount; i++) {
      const idx = i * 3;
      let px = simPositions[idx], py = simPositions[idx + 1], pz = simPositions[idx + 2];
      let vx = simVelocities[idx], vy = simVelocities[idx + 1], vz = simVelocities[idx + 2];

      let fx = (targetPositions[idx] - px) * SPRING - vx * DAMPING;
      let fy = (targetPositions[idx + 1] - py) * SPRING - vy * DAMPING;
      let fz = (targetPositions[idx + 2] - pz) * SPRING - vz * DAMPING;

      vx += fx * dt; vy += fy * dt; vz += fz * dt;

      const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
      if (speed > MAX_DRONE_SPEED) {
        vx = (vx / speed) * MAX_DRONE_SPEED;
        vy = (vy / speed) * MAX_DRONE_SPEED;
        vz = (vz / speed) * MAX_DRONE_SPEED;
      }

      simPositions[idx]     += vx * dt;
      simPositions[idx + 1] += vy * dt;
      simPositions[idx + 2] += vz * dt;

      simVelocities[idx]     = vx;
      simVelocities[idx + 1] = vy;
      simVelocities[idx + 2] = vz;
    }

    if (s % physicsSubsteps === 0 && frameIdx < totalFrames) {
      for (let i = 0; i < activeDroneCount; i++) {
        // Negate Z to convert from Three.js right-handed to Unity left-handed space
        positions[i][frameIdx * 3]     = simPositions[i * 3];
        positions[i][frameIdx * 3 + 1] = simPositions[i * 3 + 1];
        positions[i][frameIdx * 3 + 2] = -simPositions[i * 3 + 2];
      }
      frameIdx++;
    }
  }

  const tracks = [];
  for (let i = 0; i < activeDroneCount; i++) {
    tracks.push(
      new THREE.VectorKeyframeTrack(
        `Drone_${i}.position`,
        times,
        positions[i],
        THREE.InterpolateLinear
      )
    );
  }

  const clip = new THREE.AnimationClip("DroneShowFlight", TOTAL_DURATION, tracks);

  new GLTFExporter().parse(
    root,
    (buffer) => {
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Samhain_Drone_Show.glb";
      link.click();
      console.log("GLB baked and exported with full physics continuity!");
    },
    (err) => console.error("Export error:", err),
    { binary: true, animations: [clip] }
  );
};

// Boot Sequence
(async () => {
  await buildShowTrajectoryData();
  evaluateTimeline(0);
})();

renderer.xr.addEventListener("sessionstart", () => {
  document.body.classList.add("xr-active");
  renderer.xr.setFoveation(0.0);
  xrRig.position.set(0, 0, 38);
  xrRig.rotation.set(0, 0, 0);
});
renderer.xr.addEventListener("sessionend", () => {
  document.body.classList.remove("xr-active");
});

const SPRING = 7.5;
const DAMPING = 4.0;
const MAX_DRONE_SPEED = 8.5;

let prevTime = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - prevTime) / 1000);
  prevTime = now;

  if (showState === "PRE_SHOW") {
    pauseCountdown -= dt;
    evaluateTimeline(0.0);
    if (pauseCountdown <= 0) {
      showState = "RUNNING";
      playheadTime = 0.0;
    }
  } else if (showState === "RUNNING") {
    playheadTime += dt;
    if (playheadTime >= TOTAL_DURATION) {
      playheadTime = TOTAL_DURATION;
      evaluateTimeline(TOTAL_DURATION);
      showState = "POST_SHOW";
      pauseCountdown = POST_SHOW_DELAY;
    } else {
      evaluateTimeline(playheadTime);
    }
  } else if (showState === "POST_SHOW") {
    pauseCountdown -= dt;
    evaluateTimeline(TOTAL_DURATION);
    if (pauseCountdown <= 0) {
      showState = "RUNNING";
      playheadTime = 0.0;
    }
  }

  dronePoints.material.size = Math.max(0.02, BASE_DRONE_SIZE * stageGroup.scale.x);

  for (let i = 0; i < activeDroneCount; i++) {
    const idx = i * 3;
    let px = currentPositions[idx], py = currentPositions[idx + 1], pz = currentPositions[idx + 2];
    let vx = velocities[idx], vy = velocities[idx + 1], vz = velocities[idx + 2];

    let fx = (targetPositions[idx] - px) * SPRING - vx * DAMPING;
    let fy = (targetPositions[idx + 1] - py) * SPRING - vy * DAMPING;
    let fz = (targetPositions[idx + 2] - pz) * SPRING - vz * DAMPING;

    vx += fx * dt; vy += fy * dt; vz += fz * dt;

    const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
    if (speed > MAX_DRONE_SPEED) {
      vx = (vx / speed) * MAX_DRONE_SPEED;
      vy = (vy / speed) * MAX_DRONE_SPEED;
      vz = (vz / speed) * MAX_DRONE_SPEED;
    }

    currentPositions[idx]     += vx * dt;
    currentPositions[idx + 1] += vy * dt;
    currentPositions[idx + 2] += vz * dt;

    velocities[idx]     = vx;
    velocities[idx + 1] = vy;
    velocities[idx + 2] = vz;

    currentColors[idx]     += (targetColors[idx] - currentColors[idx]) * 7.0 * dt;
    currentColors[idx + 1] += (targetColors[idx + 1] - currentColors[idx + 1]) * 7.0 * dt;
    currentColors[idx + 2] += (targetColors[idx + 2] - currentColors[idx + 2]) * 7.0 * dt;
  }

  // Atmospheric Particles
  const showBodyEnd = TOTAL_DURATION - landingConfig.dur;
  if (precipConfig.enabled && playheadTime > takeoffConfig.dur && playheadTime < showBodyEnd) {
    const fallSpeed = precipConfig.speed;
    const windRad = THREE.MathUtils.degToRad(precipConfig.angle);
    const windXShift = Math.sin(windRad) * Math.abs(fallSpeed);
    const formationCount = Math.max(50, activeDroneCount - precipConfig.count);

    for (let i = formationCount; i < activeDroneCount; i++) {
      const idx = i * 3;
      const seed = precipDriftSeeds[i];

      precipPositions[idx + 1] -= fallSpeed * dt;
      precipPositions[idx]     += windXShift * dt;
      precipPositions[idx]     += Math.sin(now * 0.0015 + seed) * 0.6 * dt;
      precipPositions[idx + 2] += Math.cos(now * 0.0012 + seed) * 0.6 * dt;

      if (precipPositions[idx + 1] < 1.5) {
        precipPositions[idx + 1] = 31.5;
        precipPositions[idx]     = (Math.random() - 0.5) * 36;
        precipPositions[idx + 2] = (Math.random() - 0.5) * 36;
        currentPositions[idx]     = precipPositions[idx];
        currentPositions[idx + 1] = precipPositions[idx + 1];
        currentPositions[idx + 2] = precipPositions[idx + 2];
      }
    }
  }

  droneGeometry.attributes.position.needsUpdate = true;
  droneGeometry.attributes.color.needsUpdate = true;

  if (!renderer.xr.isPresenting) orbit.update();
  renderer.render(scene, camera);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
