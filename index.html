import * as THREE from "three";

const GOLDEN = ShapesModule.GOLDEN || (Math.PI * (3 - Math.sqrt(5)));
const ASSET_BASE_URL = "https://lkncoder.github.io/samhain-drone-show/";

// Built-in 19-formation sampler & semantic swatch engine so even if a browser caches an older shapes.js,
// all 19 formations (including Tiles 20, 21, 22, 23) still render with 100% accuracy.
function traceAllBoundaryLoopsLocal(edgePixels) {
  if (edgePixels.length === 0) return [];
  const edgeSet = new Set(edgePixels.map(p => (p.y << 10) | p.x));
  const visited = new Set();
  const allLoops = [];
  const dirs = [
    { dx: 1, dy: 0 }, { dx: 1, dy: 1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 1 },
    { dx: -1, dy: 0 }, { dx: -1, dy: -1 }, { dx: 0, dy: -1 }, { dx: 1, dy: -1 }
  ];

  for (const startPt of edgePixels) {
    const startKey = (startPt.y << 10) | startPt.x;
    if (visited.has(startKey)) continue;
    const currentLoop = [];
    let curr = startPt;
    let lastDir = 0;
    visited.add(startKey);
    currentLoop.push(curr);

    const maxSteps = Math.max(300, edgePixels.length);
    for (let step = 0; step < maxSteps; step++) {
      let found = false;
      for (let i = 0; i < 8; i++) {
        const dIdx = (lastDir + i) % 8;
        const nx = curr.x + dirs[dIdx].dx;
        const ny = curr.y + dirs[dIdx].dy;
        const nKey = (ny << 10) | nx;
        if (edgeSet.has(nKey) && !visited.has(nKey)) {
          visited.add(nKey);
          curr = { x: nx, y: ny };
          currentLoop.push(curr);
          lastDir = (dIdx + 5) % 8;
          found = true;
          break;
        }
      }
      if (!found) {
        let nearest = null, minD = Infinity;
        for (const p of edgePixels) {
          const pk = (p.y << 10) | p.x;
          if (!visited.has(pk)) {
            const d = (p.x - curr.x) ** 2 + (p.y - curr.y) ** 2;
            if (d < minD) { minD = d; nearest = p; }
          }
        }
        if (nearest && minD <= 25) {
          curr = nearest;
          visited.add((curr.y << 10) | curr.x);
          currentLoop.push(curr);
          lastDir = 0;
        } else {
          break;
        }
      }
    }
    if (currentLoop.length >= 3) allLoops.push(currentLoop);
  }
  return allLoops;
}

function resampleEquidistantLocal(orderedPts, targetCount) {
  if (orderedPts.length === 0 || targetCount <= 0) return [];
  if (targetCount === 1) return [orderedPts[0]];
  const dists = [0];
  for (let i = 1; i < orderedPts.length; i++) {
    const dx = orderedPts[i].x - orderedPts[i - 1].x;
    const dy = orderedPts[i].y - orderedPts[i - 1].y;
    dists.push(dists[i - 1] + Math.sqrt(dx * dx + dy * dy));
  }
  const totalLen = dists[dists.length - 1];
  if (totalLen <= 0.001) return Array(targetCount).fill(orderedPts[0]);
  const stepDist = totalLen / targetCount;
  const resampled = [];
  let segIdx = 0;
  for (let i = 0; i < targetCount; i++) {
    const targetD = i * stepDist;
    while (segIdx < dists.length - 2 && dists[segIdx + 1] < targetD) segIdx++;
    const segLen = dists[segIdx + 1] - dists[segIdx];
    const t = segLen > 0.0001 ? (targetD - dists[segIdx]) / segLen : 0;
    const p0 = orderedPts[segIdx], p1 = orderedPts[segIdx + 1];
    resampled.push({ x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t });
  }
  return resampled;
}

function getSemanticSwatchLocal(px, py, tileNum, minY = 0, maxY = 512, minX = 0, maxX = 512, isl = null, loopIdx = 0) {
  const normY = (py - minY) / Math.max(1, maxY - minY);
  const normX = (px - minX) / Math.max(1, maxX - minX);
  const pCount = isl ? isl.pixelCount : 5000;
  const ix0 = isl ? isl.x0 : minX;
  const ix1 = isl ? isl.x1 : maxX;
  const iy0 = isl ? isl.y0 : minY;
  const iy1 = isl ? isl.y1 : maxY;

  switch (tileNum) {
    case 16: {
      if (iy1 > 420) return 1;
      if (pCount < 550 && py < 300) return 2;
      return 0;
    }
    case 25: {
      if (iy0 > 330) return 1;
      if (pCount < 2000) return 2;
      return 0;
    }
    case 28: {
      if (pCount > 10000) {
        const branchLineY = 330.0 - (px - 205.0) * 0.42;
        return (py > branchLineY) ? 1 : 0;
      }
      return (pCount < 3000) ? 1 : 2;
    }
    case 26: {
      if (normY > 0.58 || (normY > 0.40 && Math.abs(normX - 0.5) < 0.14)) return 0;
      if (normY < 0.25 || normX < 0.18 || normX > 0.82) return 2;
      return 1;
    }
    case 27: {
      if (ix0 < 100 || ix1 > 395 || pCount < 450) return 2;
      if (pCount < 1500 && iy0 > 350) return 1;
      if (iy0 > 395) return 0;
      if (pCount > 20000) {
        const dLeftEye  = Math.hypot(px - 224, py - 128);
        const dRightEye = Math.hypot(px - 285, py - 128);
        const dBeak     = Math.hypot(px - 254, (py - 156) * 0.85);
        if (dLeftEye <= 22 || dRightEye <= 22 || dBeak <= 16) return 1;
      }
      return 0;
    }
    case 20: {
      if (ix0 < 80 || iy1 > 455 || pCount < 800 || iy0 > 375) return 2;
      if (pCount < 10000) return 3;
      if (py >= 62 && py <= 104 && px <= 156 - (py - 64) * 0.12) return 1;
      if (py >= 312 && px <= 305 && py > 312 + (px - 245) * 0.25) return 1;
      if (px >= 205 && px <= 355 && py >= 140 && py <= 238 && py >= 140 + (px - 220) * 0.42) return 3;
      return 0;
    }
    case 18: {
      if (iy0 < 100) return 1;
      if (pCount > 25000 || pCount < 12000) return 0;
      return 2;
    }
    case 24: {
      if (iy1 < 190) {
        const coreDist = ((px - 260.0) / 28.0) ** 2 + ((py - 146.0) / 44.0) ** 2;
        if (loopIdx > 0 || coreDist <= 1.0) return 3;
        return 1;
      }
      if (iy0 > 395) return 2;
      if (py < 190 && px >= 248 && px <= 268) return 3;
      return 0;
    }
    case 21: {
      if (iy1 < 210) return 1;
      if (iy0 >= 408) return 3;
      if (iy0 >= 345 && iy1 <= 418 && ix0 > 175 && ix1 < 330) {
        if (Math.abs(px - 253) < 26 && py > 372) return 4;
        return 2;
      }
      return 0;
    }
    case 23: {
      if (ix1 < 180 && iy1 < 180) return 4;
      if (ix0 >= 310 && iy0 >= 110 && iy1 <= 175 && pCount < 2000) return 1;
      if (ix0 >= 358 && ix1 <= 406 && iy0 >= 245 && iy1 <= 280 && pCount < 600) return 1;
      if (ix1 < 155 && iy0 > 325) return 3;
      if (
        (ix1 < 200 && iy0 > 325) ||
        ix0 > 390 ||
        (ix0 > 340 && iy0 > 264 && iy1 < 290) ||
        (ix0 > 180 && ix1 < 230 && iy0 > 325 && iy1 < 355)
      ) {
        return 2;
      }
      return 0;
    }
    case 32: {
      return (iy0 > 200 && iy1 < 330) ? 1 : 0;
    }
    case 19: {
      return (pCount < 1500) ? 1 : 0;
    }
    case 22: {
      if (ix0 < 60 && iy0 > 310) {
        if ((px > 152 && py > 348) || (px > 120 && Math.abs(py - (392 - (px - 120) * 0.36)) < 9)) {
          return 2;
        }
        return 1;
      }
      if (ix0 > 400) return 1;
      if (iy0 >= 398 && ix1 < 245) {
        return (pCount < 450) ? 2 : 3;
      }
      if (px > 115 && px < 222 && py > 135 && py < 305) return 4;
      return 0;
    }
    case 29: {
      return (pCount > 8500) ? 0 : 1;
    }
    case 30: {
      return (pCount < 6200) ? 1 : 0;
    }
    case 31: {
      return (Math.hypot(px - 256, py - 265) < 115) ? 0 : 1;
    }
    case 33: {
      if (iy0 < 100) return 1;
      if (pCount > 13000) {
        if (Math.hypot(px - 205, py - 280) <= 22 || Math.hypot(px - 304, py - 280) <= 22) {
          return 2;
        }
      }
      return 0;
    }
    case 34: {
      if (
        (px >= 188 && px <= 325 && py >= 188 && py <= 325) ||
        (py >= 90 && py <= 108) ||
        (py >= 402 && py <= 420) ||
        (px >= 92 && px <= 110) ||
        (px >= 401 && px <= 420)
      ) {
        return 1;
      }
      return 0;
    }
    case 17: {
      if (py < 248) {
        return (normY < 0.22) ? 0 : 1;
      }
      return (normY < 0.78) ? 2 : 3;
    }
    default:
      return 0;
  }
}

function sampleImageToDronesLocal(imgElement, out, count, swatchOut, scale = 0.048, altitude = 16, tileNum = 16) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, 512, 512);
  ctx.drawImage(imgElement, 0, 0, 512, 512);

  const imgData = ctx.getImageData(0, 0, 512, 512).data;
  const binary = new Uint8Array(512 * 512);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const cornerAlpha = (imgData[16 * 512 * 4 + 16 * 4 + 3] + imgData[16 * 512 * 4 + 495 * 4 + 3] + imgData[495 * 512 * 4 + 16 * 4 + 3]) / 3;
  const isTransparentBg = cornerAlpha < 50;

  for (let y = 16; y < 496; y++) {
    for (let x = 16; x < 496; x++) {
      const idx = (y * 512 + x) * 4;
      const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2], a = imgData[idx + 3];
      const lum = r * 0.299 + g * 0.587 + b * 0.114;
      const isForeground = isTransparentBg ? (a > 40) : (lum > 45 || (r + g + b > 80));
      if (isForeground) {
        binary[y * 512 + x] = 1;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }

  const maxSpan = Math.max(maxX - minX, maxY - minY);
  if (maxSpan < 40 || !isFinite(minX)) return;

  const autoScale = 18.0 / maxSpan;
  const visited = new Uint8Array(512 * 512);
  const islands = [];

  for (let y = 16; y < 496; y++) {
    for (let x = 16; x < 496; x++) {
      const idx = y * 512 + x;
      if (binary[idx] === 1 && !visited[idx]) {
        const islandPixels = [];
        const queue = [{ x, y }];
        visited[idx] = 1;
        let ix0 = x, ix1 = x, iy0 = y, iy1 = y;

        while (queue.length > 0) {
          const pt = queue.pop();
          islandPixels.push(pt);
          if (pt.x < ix0) ix0 = pt.x; if (pt.x > ix1) ix1 = pt.x;
          if (pt.y < iy0) iy0 = pt.y; if (pt.y > iy1) iy1 = pt.y;
          const neighbors = [
            { x: pt.x + 1, y: pt.y }, { x: pt.x - 1, y: pt.y },
            { x: pt.x, y: pt.y + 1 }, { x: pt.x, y: pt.y - 1 }
          ];
          for (const n of neighbors) {
            if (n.x >= 16 && n.x < 496 && n.y >= 16 && n.y < 496) {
              const nIdx = n.y * 512 + n.x;
              if (binary[nIdx] === 1 && !visited[nIdx]) {
                visited[nIdx] = 1;
                queue.push(n);
              }
            }
          }
        }

        if (islandPixels.length >= 8) {
          const edge = [];
          for (const p of islandPixels) {
            const top   = binary[(p.y - 1) * 512 + p.x];
            const bot   = binary[(p.y + 1) * 512 + p.x];
            const left  = binary[p.y * 512 + (p.x - 1)];
            const right = binary[p.y * 512 + (p.x + 1)];
            if (!top || !bot || !left || !right) edge.push(p);
          }
          const allLoops = traceAllBoundaryLoopsLocal(edge);
          let totalLoopLen = 0;
          for (const loop of allLoops) totalLoopLen += loop.length;

          let weight = totalLoopLen * 2.2 + Math.sqrt(islandPixels.length) * 4.0;
          if (tileNum === 22) {
            if (ix0 < 180 && iy1 < 350 && islandPixels.length < 15000) weight *= 0.42;
            else if (iy0 >= 398 && ix1 < 245) weight *= 1.8;
            else if ((ix0 < 60 && iy0 > 310) || ix0 > 400) weight *= 1.35;
          } else if (tileNum === 21) {
            if (iy1 < 210) weight *= 1.35;
            else if (iy0 >= 345) weight *= 1.35;
          }
          islands.push({
            pixels: islandPixels, loops: allLoops, totalLoopLen, weight,
            pixelCount: islandPixels.length, x0: ix0, x1: ix1, y0: iy0, y1: iy1
          });
        }
      }
    }
  }

  if (islands.length === 0) return;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const totalWeight = islands.reduce((acc, isl) => acc + isl.weight, 0);
  const quotas = [];
  let allocatedSum = 0;

  for (let i = 0; i < islands.length; i++) {
    const rawQuota = (islands[i].weight / totalWeight) * count;
    const baseQuota = Math.max(3, Math.floor(rawQuota));
    quotas.push({ base: baseQuota, remainder: rawQuota - baseQuota, index: i });
    allocatedSum += baseQuota;
  }
  quotas.sort((a, b) => b.remainder - a.remainder);
  let remDrones = count - allocatedSum;
  for (let i = 0; i < quotas.length && remDrones > 0; i++, remDrones--) quotas[i].base++;
  quotas.sort((a, b) => a.index - b.index);

  let ptr = 0;
  for (let k = 0; k < islands.length; k++) {
    const isl = islands[k];
    const islDroneCount = quotas[k].base;
    const edgeRatio = (tileNum === 22 && isl.pixelCount > 7000) ? 0.92 : 0.75;
    const edgeCount = Math.min(Math.round(isl.totalLoopLen * 1.5), Math.round(islDroneCount * edgeRatio));
    const fillCount = Math.max(0, islDroneCount - edgeCount);

    if (isl.loops.length > 0 && edgeCount > 0 && isl.totalLoopLen > 0) {
      for (let lIdx = 0; lIdx < isl.loops.length; lIdx++) {
        const loop = isl.loops[lIdx];
        const loopDrones = Math.max(2, Math.round((loop.length / isl.totalLoopLen) * edgeCount));
        const resampled = resampleEquidistantLocal(loop, loopDrones);
        for (let i = 0; i < resampled.length && ptr < count; i++) {
          const p = resampled[i];
          out[ptr * 3]     = (p.x - cx) * autoScale;
          out[ptr * 3 + 1] = altitude - (p.y - cy) * autoScale;
          out[ptr * 3 + 2] = 0.0;
          if (swatchOut) swatchOut[ptr] = getSemanticSwatchLocal(p.x, p.y, tileNum, minY, maxY, minX, maxX, isl, lIdx);
          ptr++;
        }
      }
    }

    if (isl.pixels.length > 0 && fillCount > 0) {
      const stepF = isl.pixels.length / fillCount;
      for (let i = 0; i < fillCount && ptr < count; i++) {
        const p = isl.pixels[Math.floor((i + 0.5) * stepF) % isl.pixels.length];
        out[ptr * 3]     = (p.x - cx) * autoScale;
        out[ptr * 3 + 1] = altitude - (p.y - cy) * autoScale;
        out[ptr * 3 + 2] = 0.0;
        if (swatchOut) swatchOut[ptr] = getSemanticSwatchLocal(p.x, p.y, tileNum, minY, maxY, minX, maxX, isl, 0);
        ptr++;
      }
    }
  }

  while (ptr < count) {
    const ref = ptr > 0 ? (ptr % Math.max(1, ptr)) : 0;
    const srcIdx = Math.floor((ptr - ref) * 0.73) % Math.max(1, ptr);
    out[ptr * 3]     = out[srcIdx * 3] + (Math.random() - 0.5) * 0.1;
    out[ptr * 3 + 1] = out[srcIdx * 3 + 1] + (Math.random() - 0.5) * 0.1;
    out[ptr * 3 + 2] = 0.0;
    if (swatchOut) swatchOut[ptr] = swatchOut[srcIdx];
    ptr++;
  }
}

function loadTileImageLocal(tileNum) {
  return new Promise((resolve) => {
    const candidates = [
      `./samhain-tile${tileNum}.png`,
      `${ASSET_BASE_URL}samhain-tile${tileNum}.png`,
      `./tile${tileNum}.png`,
      `${ASSET_BASE_URL}tile${tileNum}.png`
    ];
    let idx = 0;
    function tryNext() {
      if (idx >= candidates.length) { resolve(null); return; }
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => { idx++; tryNext(); };
      img.src = candidates[idx];
    }
    tryNext();
  });
}

async function generateTileFormation(tileNum, out, count, swatchOut) {
  const img = await loadTileImageLocal(tileNum);
  if (img) {
    sampleImageToDronesLocal(img, out, count, swatchOut, 0.048, 16, tileNum);
  } else if (ShapesModule.generateProceduralShape) {
    ShapesModule.generateProceduralShape(tileNum, out, count, swatchOut, 16);
  }
}

    const theta = i * GOLDEN;
    groundPositions[i * 3]     = Math.cos(theta) * r;
    groundPositions[i * 3 + 1] = 0.12;
    groundPositions[i * 3 + 2] = Math.sin(theta) * r;
  }
}

const precipPositions = new Float32Array(MAX_DRONES * 3);
const precipDriftSeeds = new Float32Array(MAX_DRONES);
function initPrecipPositions() {
  const formationCount = Math.max(50, activeDroneCount - precipConfig.count);
  for (let i = 0; i < MAX_DRONES; i++) {
    const r = 4.0 + Math.sqrt(((i * 73) % 100) / 100.0) * 17.0;
    const angle = i * GOLDEN * 3.0;
    precipPositions[i * 3]     = Math.cos(angle) * r;
    precipPositions[i * 3 + 1] = 1.5 + ((i * 37) % 100) / 100.0 * 28.5;
    precipPositions[i * 3 + 2] = Math.sin(angle) * r;
    // Stratified phase seed so leaves are evenly distributed across the fall/rise cycle
    if (i >= formationCount && i < activeDroneCount) {
      precipDriftSeeds[i] = ((i - formationCount) + 0.5) / precipConfig.count;
    } else {
      precipDriftSeeds[i] = (i % 60) / 60.0;
    }
  }
}

function assignMinimalPaths(currentPos, rawTargets, rawSwatches, count) {
  const assigned = new Float32Array(count * 3);
  const assignedSwatches = new Uint8Array(count);
  const unassigned = new Set();
  for (let i = 0; i < count; i++) unassigned.add(i);

  for (let i = 0; i < count; i++) {
    const cx = currentPos[i * 3], cy = currentPos[i * 3 + 1], cz = currentPos[i * 3 + 2];
    let closest = -1, minD = Infinity;
    for (const tIdx of unassigned) {
      const tx = rawTargets[tIdx * 3], ty = rawTargets[tIdx * 3 + 1], tz = rawTargets[tIdx * 3 + 2];
      const d = (cx - tx) ** 2 + (cy - ty) ** 2 + (cz - tz) ** 2;
      if (d < minD) { minD = d; closest = tIdx; }
    }
    unassigned.delete(closest);
    assigned[i * 3]     = rawTargets[closest * 3];
    assigned[i * 3 + 1] = rawTargets[closest * 3 + 1];
    assigned[i * 3 + 2] = rawTargets[closest * 3 + 2];
    if (rawSwatches) assignedSwatches[i] = rawSwatches[closest];
  }
  return { positions: assigned, swatches: assignedSwatches };
}

const tempColor = new THREE.Color();
const prevBlockColor = new THREE.Color();

function applyDirectColor(block) {

const rotEuler = new THREE.Euler(0, 0, 0, "YXZ");
const rotMatrix = new THREE.Matrix4();
const centerPt = new THREE.Vector3(0, 16, 0);

function transformToSky(x, y, z, altitude, scale, angleY, outVec) {
  rotEuler.set(0, angleY, 0);
  rotMatrix.makeRotationFromEuler(rotEuler);
  centerPt.set(0, altitude, 0);

  outVec.set(x * scale, (y - 16) * scale + altitude, z * scale);
  outVec.sub(centerPt);
  outVec.applyMatrix4(rotMatrix);
  outVec.add(centerPt);
  outVec.y = Math.max(0.12, outVec.y);
}

const skyPosA = new THREE.Vector3();
const skyPosB = new THREE.Vector3();
const localScratchPoints = new Float32Array(MAX_DRONES * 3);

// Continuous physical 2-phase leaf cycle:
// Phase 1 (0 <= cyclePhase < FALL_FRAC): drifts downward from 30m to 1.5m (visible in 0.06 <= uFall <= 0.92).
// Phase 2 (FALL_FRAC <= cyclePhase < 1.0): physically flies back up from 1.5m to 30m (100% invisible).
const LEAF_FALL_DUR = 9.0;
const LEAF_RISE_DUR = 4.0;
const LEAF_CYCLE_DUR = LEAF_FALL_DUR + LEAF_RISE_DUR;
const LEAF_FALL_FRAC = LEAF_FALL_DUR / LEAF_CYCLE_DUR;

function evaluateLeafDrone(i, tInShow, outPos, outColor, outVis) {
  const x0 = precipPositions[i * 3];
  const z0 = precipPositions[i * 3 + 2];
  const seed = precipDriftSeeds[i];
  const cyclePhase = ((tInShow / LEAF_CYCLE_DUR) + seed) % 1.0;

  if (cyclePhase < LEAF_FALL_FRAC) {
    const uFall = cyclePhase / LEAF_FALL_FRAC; // 0.0 at ceiling (30m) -> 1.0 at ground (1.5m)
    const swayPhase = uFall * Math.PI * 3.0 + seed * Math.PI * 2.0;
    outPos[i * 3]     = x0 + Math.sin(swayPhase) * 1.5;
    outPos[i * 3 + 1] = 30.0 - uFall * 28.5;
    outPos[i * 3 + 2] = z0 + Math.cos(swayPhase * 0.85) * 1.5;

    // Buffer zones at top (uFall < 0.06) and bottom (uFall > 0.92) ensure the drone
    // is completely dark/zero-scale before reversing vertical direction.
    if (uFall >= 0.06 && uFall <= 0.92) {
      const c = leafColors[i % leafColors.length];
      outColor[i * 3]     = c.r;
      outColor[i * 3 + 1] = c.g;
      outColor[i * 3 + 2] = c.b;
      outVis[i] = 1;
    } else {
      outColor[i * 3]     = 0.0;
      outColor[i * 3 + 1] = 0.0;
      outColor[i * 3 + 2] = 0.0;
      outVis[i] = 0;
    }
  } else {
    // Physical upward return flight: completely invisible (dark in preview, 0 scale in GLB)
    const uRise = (cyclePhase - LEAF_FALL_FRAC) / (1.0 - LEAF_FALL_FRAC);
    const easeRise = uRise * uRise * (3.0 - 2.0 * uRise);
    const endSway = Math.PI * 3.0 + seed * Math.PI * 2.0;
    const startSway = seed * Math.PI * 2.0;
    const sx = THREE.MathUtils.lerp(Math.sin(endSway), Math.sin(startSway), easeRise) * 1.5;
    const sz = THREE.MathUtils.lerp(Math.cos(endSway * 0.85), Math.cos(startSway * 0.85), easeRise) * 1.5;

    outPos[i * 3]     = x0 + sx;
    outPos[i * 3 + 1] = 1.5 + easeRise * 28.5;
    outPos[i * 3 + 2] = z0 + sz;

    outColor[i * 3]     = 0.0;
    outColor[i * 3 + 1] = 0.0;
    outColor[i * 3 + 2] = 0.0;
    outVis[i] = 0;
  }
}

let activePhaseLabel = "Takeoff";

function evaluateTimeline(t) {
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;
  const showBodyEnd = TOTAL_DURATION - landingConfig.dur;
  if (formationTrajectories.length === 0) return;

  // 1. Takeoff Phase: Drones lift off from ground pad into formation 1 & initial leaf cycle positions
  if (t <= takeoffConfig.dur) {
    activePhaseLabel = "Takeoff";
    const u = Math.max(0, t / takeoffConfig.dur);
    const ease = u * u * (3 - 2 * u);
    const firstTargets = formationTrajectories[0];
    const firstSwatches = formationSwatchStore[0];
    const b0 = timelineData.formationBlocks[0];
    const alt = b0.altitude || 16.0;
    const scl = b0.scale || 1.0;
    const v0y = THREE.MathUtils.degToRad(b0.rotStartY || 0);
    const pal0 = b0.palette || ["#ffd54f"];

    for (let i = 0; i < formationCount; i++) {
      const gx = groundPositions[i * 3], gy = groundPositions[i * 3 + 1], gz = groundPositions[i * 3 + 2];
      transformToSky(firstTargets[i * 3], firstTargets[i * 3 + 1], firstTargets[i * 3 + 2], alt, scl, v0y, skyPosA);

      targetPositions[i * 3]     = gx + (skyPosA.x - gx) * ease;
      targetPositions[i * 3 + 1] = gy + (skyPosA.y - gy) * ease;
      targetPositions[i * 3 + 2] = gz + (skyPosA.z - gz) * ease;

      const sw = firstSwatches ? firstSwatches[i] : 0;
      droneSwatchIndices[i] = sw;
      tempColor.set(pal0[sw % pal0.length]);
      targetColors[i * 3]     = tempColor.r * (0.25 + 0.75 * ease);
      targetColors[i * 3 + 1] = tempColor.g * (0.25 + 0.75 * ease);
      targetColors[i * 3 + 2] = tempColor.b * (0.25 + 0.75 * ease);
      isDroneVisible[i] = 1;
    }

    // Precipitation Drones: Ascend invisibly from ground pad into their tInShow=0 cycle positions
    if (precipConfig.enabled) {
      for (let i = formationCount; i < activeDroneCount; i++) {
        const gx = groundPositions[i * 3], gy = groundPositions[i * 3 + 1], gz = groundPositions[i * 3 + 2];
        evaluateLeafDrone(i, 0.0, targetPositions, targetColors, isDroneVisible);
        const tx = targetPositions[i * 3], ty = targetPositions[i * 3 + 1], tz = targetPositions[i * 3 + 2];

        targetPositions[i * 3]     = gx + (tx - gx) * ease;
        targetPositions[i * 3 + 1] = gy + (ty - gy) * ease;
        targetPositions[i * 3 + 2] = gz + (tz - gz) * ease;
        // Keep rising leaf drones dark during takeoff so they only appear as they drift down
        targetColors[i * 3]     = 0.0;
        targetColors[i * 3 + 1] = 0.0;
        targetColors[i * 3 + 2] = 0.0;
        isDroneVisible[i] = 0;
      }
    }
  }
  // 2. Main Formation Blocks & Transitions (All 19 Formations)
  else if (t > takeoffConfig.dur && t < showBodyEnd) {
    const showT = t - takeoffConfig.dur;
    let curT = 0;

    for (let i = 0; i < timelineData.formationBlocks.length; i++) {
      const b = timelineData.formationBlocks[i];
      const formStart = curT, formEnd = curT + b.dur, transEnd = formEnd + (b.transDur || 0);
      const currTargets = formationTrajectories[i];
      const currSwatches = formationSwatchStore[i];

      const alt = b.altitude || 16.0;
      const scl = b.scale || 1.0;
      const v0y = THREE.MathUtils.degToRad(b.rotStartY || 0);
      const v1y = THREE.MathUtils.degToRad(b.rotEndY || 0);

      if (showT >= formStart && showT < formEnd) {
        activePhaseLabel = b.name;
        const uBlock = (showT - formStart) / b.dur;
        const curRotY = v0y + (v1y - v0y) * uBlock;
        const tScene = showT - formStart;
        const env = Math.sin(Math.PI * uBlock);

        localScratchPoints.set(currTargets.subarray(0, formationCount * 3));

        if (b.tileNum === 16) { // Wheat sway
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1], px = localScratchPoints[j * 3];
            const yNorm = Math.max(0, Math.min(1, (py - 8) / 16));
            const sway = (Math.sin(tScene * 2.2 + px * 0.25) * 1.5 + Math.sin(tScene * 4.5) * 0.4) * Math.pow(yNorm, 1.6);
            localScratchPoints[j * 3] += sway * env;
            localScratchPoints[j * 3 + 1] -= Math.abs(sway) * 0.12 * yNorm * env;
          }
        } else if (b.tileNum === 25) { // Scythe cutting swing
          const swingPhase = uBlock * Math.PI * 2.0;
          const cutMotion = Math.sin(swingPhase) * 0.35;
          const cosCut = Math.cos(cutMotion), sinCut = Math.sin(cutMotion);
          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3], ly = localScratchPoints[j * 3 + 1] - 14.0;
            localScratchPoints[j * 3]     = lx * cosCut - ly * sinCut;
            localScratchPoints[j * 3 + 1] = 14.0 + (lx * sinCut + ly * cosCut);
          }
        } else if (b.tileNum === 28) { // Leaf flutter
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            const amp = (currSwatches && currSwatches[j] === 0) ? 0.75 : 0.25;
            localScratchPoints[j * 3] += Math.sin(tScene * 3.2 + py * 0.4) * amp * env;
            localScratchPoints[j * 3 + 2] += Math.cos(tScene * 2.8 + py * 0.3) * (amp * 0.75) * env;
          }
        } else if (b.tileNum === 26) { // Tree branch sway
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            if (py > 15.5) {
              const yNorm = Math.max(0, (py - 15.5) / 10.0);
              localScratchPoints[j * 3] += Math.sin(tScene * 2.2 + py * 0.25) * (yNorm * 0.7) * env;
            }
          }
        } else if (b.tileNum === 27) { // Owl head/body tilt while branch stays steady
          const rockAngle = Math.sin(uBlock * Math.PI * 2.0) * 0.12;
          const ca = Math.cos(rockAngle), sa = Math.sin(rockAngle);
          for (let j = 0; j < formationCount; j++) {
            const py = localScratchPoints[j * 3 + 1];
            const isBranch = currSwatches && currSwatches[j] === 2;
            if (!isBranch && py > 10.5) {
              const lx = localScratchPoints[j * 3], ly = py - 10.5;
              localScratchPoints[j * 3]     = lx * ca - ly * sa;
              localScratchPoints[j * 3 + 1] = 10.5 + (lx * sa + ly * ca);
            }
          }
        } else if (b.tileNum === 20) { // Raven: Beak cawing (open/close) + wing feathers flapping while branch & legs stay still
          const cawPulse = Math.pow(Math.max(0, Math.sin(uBlock * Math.PI * 4.0)), 1.15);
          const cawAngle = cawPulse * 0.25 * env;
          const flap = Math.sin(uBlock * Math.PI * 6.0) * env;
          const flapZ = Math.cos(uBlock * Math.PI * 6.0) * env;

          for (let j = 0; j < formationCount; j++) {
            const sw = currSwatches ? currSwatches[j] : 0;
            const px = localScratchPoints[j * 3], py = localScratchPoints[j * 3 + 1];

            if (sw === 1 && py > 20.0) {
              // Beak (hinged at base x = -4.22; upper beak py >= 23.24 rotates UP, lower beak py < 23.24 rotates DOWN)
              const hx = -4.22;
              const isUpper = py >= 23.24;
              const hy = isUpper ? 23.55 : 23.05;
              // Because dx = px - hx < 0 (beak points left), negative angle lifts y upward and positive angle drops y downward
              const ang = isUpper ? -cawAngle : (cawAngle * 1.15);
              const ca = Math.cos(ang), sa = Math.sin(ang);
              const dx = px - hx, dy = py - hy;
              localScratchPoints[j * 3]     = hx + dx * ca - dy * sa;
              localScratchPoints[j * 3 + 1] = hy + dx * sa + dy * ca;
            } else if (sw === 3) {
              // Layered wing feathers flap in Y and Z around the wing shoulder (-1.5, 19.8)
              const span = Math.max(0.25, (px - (-1.5)) * 0.26);
              localScratchPoints[j * 3 + 1] += flap * span * 1.45;
              localScratchPoints[j * 3 + 2] += flapZ * span * 1.15;
            } else if (sw === 0 && py > 18.5) {
              // Subtle head/throat lift synchronized with the caw
              localScratchPoints[j * 3 + 1] += cawPulse * 0.20 * env;
            }
          }
        } else if (b.tileNum === 18) { // Pumpkin heartbeat pulse
          const wobble = 1.0 + Math.sin(uBlock * Math.PI * 4.0) * 0.04;
          for (let j = 0; j < formationCount; j++) {
            localScratchPoints[j * 3]     *= wobble;
            localScratchPoints[j * 3 + 1] = alt + (localScratchPoints[j * 3 + 1] - alt) * wobble;
          }
        } else if (b.tileNum === 24) { // Candle flame flicker (both outer red & inner yellow core)
          for (let j = 0; j < formationCount; j++) {
            const sw = currSwatches ? currSwatches[j] : 0;
            if (sw === 1 || sw === 3) {
              const py = localScratchPoints[j * 3 + 1];
              localScratchPoints[j * 3] += Math.sin(tScene * 5.5 + py * 1.5) * 0.4 * env;
            }
          }
        } else if (b.tileNum === 21) { // Cauldron: White steam billowing upward + campfire flames flickering
          for (let j = 0; j < formationCount; j++) {
            const sw = currSwatches ? currSwatches[j] : 0;
            const px = localScratchPoints[j * 3], py = localScratchPoints[j * 3 + 1];
            if (sw === 1) {
              // White rising steam & boiling surface bubbles
              const steamH = Math.max(0.1, (py - 18.0) / 6.5);
              localScratchPoints[j * 3]     += Math.sin(tScene * 3.8 + py * 0.85) * (0.2 + steamH * 0.55) * env;
              localScratchPoints[j * 3 + 1] += (Math.sin(tScene * 3.2 - py * 0.65 + px * 0.4) * 0.38 + steamH * 0.48) * env;
              localScratchPoints[j * 3 + 2] += Math.cos(tScene * 2.8 + py * 0.7) * (0.35 * steamH) * env;
            } else if (sw === 2 || sw === 4) {
              // Red/yellow campfire flames flickering beneath cauldron
              localScratchPoints[j * 3]     += Math.sin(tScene * 7.5 + py * 2.2) * 0.35 * env;
              localScratchPoints[j * 3 + 1] += Math.abs(Math.sin(tScene * 9.0 + px * 1.4)) * 0.32 * env;
            }
          }
        } else if (b.tileNum === 23) { // Witch on Broomstick: Witch & broom bob up and down while white Crescent Moon stays motionless
          const bobY = Math.sin(uBlock * Math.PI * 4.0) * 0.95 * env;
          const pitch = Math.cos(uBlock * Math.PI * 4.0) * 0.045 * env;
          for (let j = 0; j < formationCount; j++) {
            const sw = currSwatches ? currSwatches[j] : 0;
            if (sw !== 4) { // Swatch 4 is the Crescent Moon — keep it 100% motionless!
              const px = localScratchPoints[j * 3];
              localScratchPoints[j * 3 + 1] += bobY + px * pitch;
              if (sw === 3) {
                // Subtle broom bristle flutter in the night wind
                localScratchPoints[j * 3 + 1] += Math.sin(tScene * 8.0 + px * 1.5) * 0.18 * env;
              }
            }
          }
        } else if (b.tileNum === 32) { // Key wobble
          const wobble = Math.sin(uBlock * Math.PI * 2.0) * 0.1;
          const cosW = Math.cos(wobble), sinW = Math.sin(wobble);
          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3], ly = localScratchPoints[j * 3 + 1] - alt;
            localScratchPoints[j * 3]     = lx * cosW - ly * sinW;
            localScratchPoints[j * 3 + 1] = alt + (lx * sinW + ly * cosW);
          }
        } else if (b.tileNum === 19) { // Ghost float & sway
          const floatY = Math.sin(uBlock * Math.PI * 2.0) * 0.8;
          for (let j = 0; j < formationCount; j++) {
            localScratchPoints[j * 3 + 1] += floatY;
            localScratchPoints[j * 3] += Math.sin(tScene * 2.5 + localScratchPoints[j * 3 + 1] * 0.3) * 0.5 * env;
          }
        } else if (b.tileNum === 22) { // Skull: Eerie hover + crimson oak leaf rustle
          const skullHover = Math.sin(uBlock * Math.PI * 2.0) * 0.4 * env;
          for (let j = 0; j < formationCount; j++) {
            const sw = currSwatches ? currSwatches[j] : 0;
            const px = localScratchPoints[j * 3], py = localScratchPoints[j * 3 + 1];
            if (sw === 1) {
              // Crimson oak leaves rustling around the skull base
              localScratchPoints[j * 3]     += Math.sin(tScene * 3.6 + py * 0.5) * 0.32 * env;
              localScratchPoints[j * 3 + 2] += Math.cos(tScene * 3.0 + px * 0.4) * 0.35 * env;
            } else if (sw === 0 || sw === 4) {
              localScratchPoints[j * 3 + 1] += skullHover;
            }
          }
        } else if (b.tileNum === 29 || b.tileNum === 30 || b.tileNum === 31 || b.tileNum === 34) {
          // Full continuous 360-degree rotation for Celtic symbols & Brigid's Cross
          const dir = (b.tileNum === 31 || b.tileNum === 34) ? -1 : 1;
          const spinA = uBlock * Math.PI * 2.0 * dir;
          const cosS = Math.cos(spinA), sinS = Math.sin(spinA);
          for (let j = 0; j < formationCount; j++) {
            const lx = localScratchPoints[j * 3], ly = localScratchPoints[j * 3 + 1] - alt;
            localScratchPoints[j * 3]     = lx * cosS - ly * sinS;
            localScratchPoints[j * 3 + 1] = alt + (lx * sinS + ly * cosS);
          }
        } else if (b.tileNum === 33) {
          // Deer Head: Upright & stationary with gentle breathing hover
          const breathe = Math.sin(uBlock * Math.PI * 2.0) * 0.4;
          for (let j = 0; j < formationCount; j++) {
            localScratchPoints[j * 3 + 1] += breathe;
          }
        }

        for (let j = 0; j < formationCount; j++) {
          transformToSky(localScratchPoints[j * 3], localScratchPoints[j * 3 + 1], localScratchPoints[j * 3 + 2], alt, scl, curRotY, skyPosA);
          targetPositions[j * 3]     = skyPosA.x;
          targetPositions[j * 3 + 1] = skyPosA.y;
          targetPositions[j * 3 + 2] = skyPosA.z;
          if (currSwatches) droneSwatchIndices[j] = currSwatches[j];
          isDroneVisible[j] = 1;
        }

        applyDirectColor(b);
        break;
      } else if (showT >= formEnd && showT < transEnd) {
        const nextIdx = (i + 1 < timelineData.formationBlocks.length) ? i + 1 : 0;
        const nextB = timelineData.formationBlocks[nextIdx];
        activePhaseLabel = `${b.name} → ${nextB.name}`;
        const nextTargets = formationTrajectories[nextIdx];
        const nextSwatches = formationSwatchStore[nextIdx];

        const progress = (showT - formEnd) / b.transDur;
        const ease = progress * progress * (3 - 2 * progress);
        const arc = Math.sin(Math.PI * progress);

        const nextAlt = nextB.altitude || 16.0;
        const nextScl = nextB.scale || 1.0;
        const interpAlt = alt + (nextAlt - alt) * ease;
        const interpScl = scl + (nextScl - scl) * ease;

        const nextV0y = THREE.MathUtils.degToRad(nextB.rotStartY || 0);
        const curRotY = v1y + (nextV0y - v1y) * ease;

        localScratchPoints.set(currTargets.subarray(0, formationCount * 3));
        const motionStyle = b.transMotion || "vortex";

        for (let j = 0; j < formationCount; j++) {
          transformToSky(localScratchPoints[j * 3], localScratchPoints[j * 3 + 1], localScratchPoints[j * 3 + 2], interpAlt, interpScl, curRotY, skyPosA);
          transformToSky(nextTargets[j * 3], nextTargets[j * 3 + 1], nextTargets[j * 3 + 2], interpAlt, interpScl, curRotY, skyPosB);

          let midX = skyPosA.x + (skyPosB.x - skyPosA.x) * ease;
          let midY = skyPosA.y + (skyPosB.y - skyPosA.y) * ease;
          let midZ = skyPosA.z + (skyPosB.z - skyPosA.z) * ease;

          if (motionStyle === "vortex") {
            const dist = Math.sqrt(midX * midX + (midY - interpAlt) * (midY - interpAlt));
            const angle = Math.atan2(midY - interpAlt, midX) + progress * (Math.PI * 2.22);
            const expand = dist * (1.0 + arc * 0.38);
            midX = Math.cos(angle) * expand;
            midY = interpAlt + Math.sin(angle) * expand;
            midZ += Math.sin(j * 0.15 + progress * Math.PI * 2.0) * (arc * 4.5);
          } else if (motionStyle === "explosion") {
            const dirX = midX, dirY = midY - interpAlt;
            const len = Math.max(0.1, Math.sqrt(dirX * dirX + dirY * dirY));
            const blast = arc * 14.0 * (0.8 + (j % 12) * 0.035);
            midX += (dirX / len) * blast;
            midY += (dirY / len) * blast;
            midZ += (Math.sin(j * 37.1) * 2.0 - 1.0) * (arc * 7.5);
          } else if (motionStyle === "celtic_swirl") {
            const phase = (j / formationCount) * Math.PI * 4.0;
            midX += Math.cos(phase + progress * Math.PI) * (arc * 8.5);
            midY += Math.sin(progress * Math.PI * 2.0 + phase) * (arc * 5.0);
            midZ += Math.sin(progress * Math.PI * 3.0 + (j % 5)) * (arc * 7.0);
          } else if (motionStyle === "helix") {
            const angle = progress * Math.PI * 2.4 + (j % 24) * (Math.PI / 12);
            midX += Math.cos(angle) * (9.5 * arc);
            midY += Math.sin(angle) * (arc * 4.0);
            midZ += Math.sin(angle) * (9.5 * arc);
          } else if (motionStyle === "cascade_wave") {
            const waveX = (midX + 20.0) / 40.0;
            const phase = progress * Math.PI * 2.5 - waveX * Math.PI * 2.0;
            midY += Math.sin(phase) * (arc * 7.5);
            midZ += Math.cos(phase) * (arc * 6.0);
          } else if (motionStyle === "winged_sweep") {
            const wingSide = midX >= 0 ? 1.0 : -1.0;
            const wingSpan = Math.sin(progress * Math.PI * 2.0 + Math.abs(midX) * 0.25);
            midX += wingSide * (arc * 6.0);
            midY += wingSpan * (arc * 6.5);
            midZ += Math.cos(progress * Math.PI * 2.0 + (j % 16) * 0.35) * (arc * 6.5);
          } else if (motionStyle === "fire_spiral") {
            const spin = progress * Math.PI * 3.0 + (j % 16) * (Math.PI / 8);
            const rad = arc * (4.0 + (j % 7) * 0.85);
            midX += Math.cos(spin) * rad;
            midY += arc * 5.0 + Math.sin(spin * 1.5) * (arc * 2.5);
            midZ += Math.sin(spin) * rad;
          } else if (motionStyle === "cauldron_vortex") {
            const rDist = Math.sqrt(midX * midX + (midY - interpAlt) * (midY - interpAlt));
            const swirlA = Math.atan2(midY - interpAlt, midX) - progress * Math.PI * 2.4;
            const rMod = rDist * (1.0 + arc * 0.42);
            midX = Math.cos(swirlA) * rMod;
            midY = interpAlt + Math.sin(swirlA) * rMod + Math.sin(progress * Math.PI * 2.0 + j * 0.15) * (arc * 3.5);
            midZ += Math.cos(swirlA * 2.0) * (arc * 6.0);
          } else if (motionStyle === "lunar_arc") {
            const flightPhase = progress * Math.PI - (j / formationCount) * 0.6;
            midX += Math.cos(flightPhase * 2.0) * (arc * 7.5);
            midY += arc * 7.0 + Math.sin(j * 0.25) * (arc * 2.0);
            midZ += Math.sin(progress * Math.PI * 2.0 + (j % 9) * 0.4) * (arc * 7.5);
          }

          targetPositions[j * 3]     = midX;
          targetPositions[j * 3 + 1] = Math.max(0.5, midY);
          targetPositions[j * 3 + 2] = midZ;
          isDroneVisible[j] = 1;

          if (ease > 0.5 && nextSwatches) droneSwatchIndices[j] = nextSwatches[j];
          else if (currSwatches) droneSwatchIndices[j] = currSwatches[j];
        }

        const palA = b.palette || ["#ffffff"], palB = nextB.palette || ["#ffffff"];
        for (let j = 0; j < formationCount; j++) {
          const swatchA = currSwatches ? (currSwatches[j] % palA.length) : 0;
          const swatchB = nextSwatches ? (nextSwatches[j] % palB.length) : 0;
          prevBlockColor.set(palA[swatchA]);
          nextBlockColor.set(palB[swatchB]);
          tempColor.lerpColors(prevBlockColor, nextBlockColor, ease);
          targetColors[j * 3]     = tempColor.r;
          targetColors[j * 3 + 1] = tempColor.g;
          targetColors[j * 3 + 2] = tempColor.b;
        }
        break;
      }
      curT = transEnd;
    }

    // Precipitation Drones (Falling Leaves): drift down lit, physically fly back up invisibly
    if (precipConfig.enabled) {
      const tInShow = t - takeoffConfig.dur;
      for (let i = formationCount; i < activeDroneCount; i++) {
        evaluateLeafDrone(i, tInShow, targetPositions, targetColors, isDroneVisible);
      }
    }
  }
  // 3. Finale Undulating Swarm & Helix Landing
  else {
    activePhaseLabel = "Finale Swarm & Landing";
    const landT = t - showBodyEnd;
    const u = THREE.MathUtils.clamp(landT / landingConfig.dur, 0, 1);
    const lastTargets = formationTrajectories[formationTrajectories.length - 1];
    const lastB = timelineData.formationBlocks[timelineData.formationBlocks.length - 1];
    const alt = lastB.altitude || 16.0;
    const scl = lastB.scale || 1.0;
    const v1y = THREE.MathUtils.degToRad(lastB.rotEndY || 0);

    const uExpand = Math.min(1.0, u / 0.35);
    const easeExpand = uExpand * uExpand * (3 - 2 * uExpand);
    const uDesc = Math.max(0.0, (u - 0.35) / 0.65);
    const easeDesc = uDesc * uDesc * (3 - 2 * uDesc);

    for (let i = 0; i < activeDroneCount; i++) {
      const gx = groundPositions[i * 3], gy = groundPositions[i * 3 + 1], gz = groundPositions[i * 3 + 2];

      let tX = gx, tY = 16.0, tZ = gz;
      if (i < formationCount) {
        transformToSky(lastTargets[i * 3], lastTargets[i * 3 + 1], lastTargets[i * 3 + 2], alt, scl, v1y, skyPosA);
        tX = skyPosA.x; tY = skyPosA.y; tZ = skyPosA.z;
      } else {
        tX = precipPositions[i * 3]; tY = 20.0; tZ = precipPositions[i * 3 + 2];
      }

      const phi = Math.acos(1.0 - 2.0 * ((i + 0.5) / activeDroneCount));
      const theta = i * GOLDEN + landT * 1.6;
      const rSwarm = 22.0 + Math.sin(landT * 3.0 + i * 0.15) * 5.0 + Math.sin(landT * 6.0 + theta * 2.0) * 3.0;

      const swarmX = Math.sin(phi) * Math.cos(theta) * rSwarm;
      const swarmY = alt + Math.cos(phi) * (rSwarm * 0.72) + Math.sin(landT * 4.0 + theta) * 2.2;
      const swarmZ = Math.sin(phi) * Math.sin(theta) * rSwarm;

      const curSwarmX = THREE.MathUtils.lerp(tX, swarmX, easeExpand);
      const curSwarmY = THREE.MathUtils.lerp(tY, swarmY, easeExpand);
      const curSwarmZ = THREE.MathUtils.lerp(tZ, swarmZ, easeExpand);

      const spiralAngle = (1.0 - easeDesc) * Math.PI * 4.0 + (i % 3) * (Math.PI * 2 / 3);
      const spiralRadius = Math.sin(Math.PI * easeDesc) * 8.0;

      targetPositions[i * 3]     = THREE.MathUtils.lerp(curSwarmX, gx, easeDesc) + Math.cos(spiralAngle) * spiralRadius;
      targetPositions[i * 3 + 1] = Math.max(0.12, THREE.MathUtils.lerp(curSwarmY, gy, easeDesc));
      targetPositions[i * 3 + 2] = THREE.MathUtils.lerp(curSwarmZ, gz, easeDesc) + Math.sin(spiralAngle) * spiralRadius;

      const hue = (landT * 0.4 + (i / activeDroneCount) * 0.6) % 1.0;
      tempColor.setHSL(hue, 1.0, 0.58);
      targetColors[i * 3]     = tempColor.r;
      targetColors[i * 3 + 1] = tempColor.g;
      targetColors[i * 3 + 2] = tempColor.b;
      isDroneVisible[i] = 1;
    }
  }
}

// -------------------------------------------------------------
// PHYSICS GLB EXPORTER WITH SCALE-ENCODED COLOR & INVISIBLE LEAF RETURN
// -------------------------------------------------------------
window.bakeAndDownloadGLB = async function() {
  const statusEl = document.getElementById("hud-status");
  const exportBtn = document.getElementById("btn-export");
  if (statusEl) statusEl.textContent = "Baking 60Hz GLB physics...";
  if (exportBtn) exportBtn.disabled = true;

  await new Promise(r => setTimeout(r, 30));
  await buildShowTrajectoryData();

  const savedPlayhead = playheadTime;
  const savedTargetPos = new Float32Array(targetPositions);
  const savedTargetCol = new Float32Array(targetColors);
  const savedVisible   = new Uint8Array(isDroneVisible);
  const savedSwatches  = new Uint8Array(droneSwatchIndices);

  const root = new THREE.Group();
  root.name = "SamhainDroneFleet";

  const sphereGeom = new THREE.SphereGeometry(0.25, 8, 6);
  const droneMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  for (let i = 0; i < activeDroneCount; i++) {
    const drone = new THREE.Mesh(sphereGeom, droneMat);
    drone.name = `Drone_${i}`;
    root.add(drone);
  }

  const SPRING = 11.5;
  const DAMPING = 5.2;
  const MAX_DRONE_SPEED = 14.5;

  const simPositions = new Float32Array(activeDroneCount * 3);
  const simVelocities = new Float32Array(activeDroneCount * 3);
  const simColors = new Float32Array(activeDroneCount * 3);
  simPositions.set(groundPositions.subarray(0, activeDroneCount * 3));

  const sampleFPS = 15;
  const BAKE_TOTAL_DURATION = PRE_SHOW_DELAY + TOTAL_DURATION + POST_SHOW_DELAY;
  const totalFrames = Math.floor(BAKE_TOTAL_DURATION * sampleFPS);
  const times = new Float32Array(totalFrames);
  for (let f = 0; f < totalFrames; f++) times[f] = f / sampleFPS;

  const positions = Array.from({ length: activeDroneCount }, () => new Float32Array(totalFrames * 3));
  const scales = Array.from({ length: activeDroneCount }, () => new Float32Array(totalFrames * 3));

  const physicsSubsteps = 4;
  const dt = (1 / sampleFPS) / physicsSubsteps;
  const totalSubsteps = totalFrames * physicsSubsteps;
  let frameIdx = 0;
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;
  const showBodyEnd = TOTAL_DURATION - landingConfig.dur;

  evaluateTimeline(0.0);
  simColors.set(targetColors.subarray(0, activeDroneCount * 3));

  for (let s = 0; s < totalSubsteps; s++) {
    const simTime = s * dt;
    const showTime = THREE.MathUtils.clamp(simTime - PRE_SHOW_DELAY, 0.0, TOTAL_DURATION);
    evaluateTimeline(showTime);

    const inShowBody = (showTime > takeoffConfig.dur && showTime < showBodyEnd);

    for (let i = 0; i < activeDroneCount; i++) {
      const idx = i * 3;
      let px = simPositions[idx], py = simPositions[idx + 1], pz = simPositions[idx + 2];
      let vx = simVelocities[idx], vy = simVelocities[idx + 1], vz = simVelocities[idx + 2];

      const fx = (targetPositions[idx] - px) * SPRING - vx * DAMPING;
      const fy = (targetPositions[idx + 1] - py) * SPRING - vy * DAMPING;
      const fz = (targetPositions[idx + 2] - pz) * SPRING - vz * DAMPING;

      vx += fx * dt; vy += fy * dt; vz += fz * dt;

      const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
      if (speed > MAX_DRONE_SPEED) {
        vx = (vx / speed) * MAX_DRONE_SPEED;
        vy = (vy / speed) * MAX_DRONE_SPEED;
        vz = (vz / speed) * MAX_DRONE_SPEED;
      }

      simPositions[idx]     += vx * dt;
      simPositions[idx + 1] += vy * dt;
      simPositions[idx + 2] += vz * dt;
      simVelocities[idx] = vx; simVelocities[idx + 1] = vy; simVelocities[idx + 2] = vz;

      // Double-lock for falling leaf drones: never visible while ascending
      if (i >= formationCount && inShowBody && vy > -0.15) {
        isDroneVisible[i] = 0;
      }

      if (isDroneVisible[i] === 0) {
        simColors[idx]     = 0.0;
        simColors[idx + 1] = 0.0;
        simColors[idx + 2] = 0.0;
      } else {
        const colorStep = Math.min(1.0, 18.0 * dt);
        simColors[idx]     += (targetColors[idx] - simColors[idx]) * colorStep;
        simColors[idx + 1] += (targetColors[idx + 1] - simColors[idx + 1]) * colorStep;
        simColors[idx + 2] += (targetColors[idx + 2] - simColors[idx + 2]) * colorStep;
      }
    }

    if (s % physicsSubsteps === 0 && frameIdx < totalFrames) {
      for (let i = 0; i < activeDroneCount; i++) {
        const idx = i * 3;
        positions[i][frameIdx * 3]     = simPositions[idx];
        positions[i][frameIdx * 3 + 1] = simPositions[idx + 1];
        positions[i][frameIdx * 3 + 2] = -simPositions[idx + 2];

        if (isDroneVisible[i] === 1) {
          let r = simColors[idx], g = simColors[idx + 1], b = simColors[idx + 2];
          let maxC = Math.max(r, g, b);
          if (maxC < 0.06) {
            const boost = maxC > 0.0001 ? (0.06 / maxC) : 1.0;
            r = Math.max(0.06, r * boost);
            g = g * boost;
            b = b * boost;
            maxC = Math.max(r, g, b);
          }
          // Preserve dominant-to-secondary channel ratio against Unity URP Linear->sRGB lift
          if (maxC > 0.0001) {
            r = Math.pow(Math.max(0, r / maxC), 1.30) * maxC;
            g = Math.pow(Math.max(0, g / maxC), 1.30) * maxC;
            b = Math.pow(Math.max(0, b / maxC), 1.30) * maxC;
          }
          scales[i][frameIdx * 3]     = Math.max(0.002, r);
          scales[i][frameIdx * 3 + 1] = Math.max(0.002, g);
          scales[i][frameIdx * 3 + 2] = Math.max(0.002, b);
        } else {
          scales[i][frameIdx * 3]     = 0.0;
          scales[i][frameIdx * 3 + 1] = 0.0;
          scales[i][frameIdx * 3 + 2] = 0.0;
        }
      }
      frameIdx++;
    }
  }

  playheadTime = savedPlayhead;
  targetPositions.set(savedTargetPos);
  targetColors.set(savedTargetCol);
  isDroneVisible.set(savedVisible);
  droneSwatchIndices.set(savedSwatches);

  const tracks = [];
  for (let i = 0; i < activeDroneCount; i++) {
    tracks.push(new THREE.VectorKeyframeTrack(`Drone_${i}.position`, times, positions[i], THREE.InterpolateLinear));
    tracks.push(new THREE.VectorKeyframeTrack(`Drone_${i}.scale`, times, scales[i], THREE.InterpolateLinear));
  }

  const clip = new THREE.AnimationClip("DroneShowFlight", BAKE_TOTAL_DURATION, tracks);

  new GLTFExporter().parse(
    root,
    (buffer) => {
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Samhain_Drone_Show.glb";
      link.click();
      if (statusEl) statusEl.textContent = "GLB exported!";
      if (exportBtn) exportBtn.disabled = false;
    },
    (err) => {
      console.error("Export error:", err);
      if (statusEl) statusEl.textContent = "Export failed (see console)";
      if (exportBtn) exportBtn.disabled = false;
    },
    { binary: true, animations: [clip] }
  );
};

// HUD Controls Setup
const btnPlay = document.getElementById("btn-play");
const sceneSelect = document.getElementById("scene-select");
const timeScrub = document.getElementById("time-scrub");
const hudStatus = document.getElementById("hud-status");
const btnExport = document.getElementById("btn-export");

if (timeScrub) timeScrub.max = String(TOTAL_DURATION);

const sceneStartTimes = [];
let accumT = takeoffConfig.dur;
for (const b of timelineData.formationBlocks) {
  sceneStartTimes.push(accumT + 0.5);
  accumT += b.dur + (b.transDur || 0);
}

function jumpToShowTime(targetTime) {
  showState = "RUNNING";
  playheadTime = targetTime;
  evaluateTimeline(playheadTime);
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;
  // Snap formation drones close to target when user clicks a quick-jump button so they see the formation immediately
  for (let i = 0; i < formationCount * 3; i++) {
    currentPositions[i] = targetPositions[i];
    velocities[i] = 0;
    currentColors[i] = targetColors[i];
  }
}

if (sceneSelect) {
  const optTakeoff = document.createElement("option");
  optTakeoff.value = "0";
  optTakeoff.textContent = "0. Takeoff (0s)";
  sceneSelect.appendChild(optTakeoff);

  for (let idx = 0; idx < timelineData.formationBlocks.length; idx++) {
    const b = timelineData.formationBlocks[idx];
    const startT = sceneStartTimes[idx] - 0.5;
    const opt = document.createElement("option");
    opt.value = String(sceneStartTimes[idx]);
    const isNew = (b.tileNum === 20 || b.tileNum === 21 || b.tileNum === 22 || b.tileNum === 23);
    const isSpin = (b.tileNum === 29 || b.tileNum === 30 || b.tileNum === 31 || b.tileNum === 34);
    const prefix = isNew ? "★ " : (isSpin ? "↻ " : "");
    opt.textContent = `${prefix}${b.name} (${Math.round(startT)}s)`;
    sceneSelect.appendChild(opt);
  }

  const optLand = document.createElement("option");
  optLand.value = String(TOTAL_DURATION - landingConfig.dur);
  optLand.textContent = `20. Finale Swarm & Landing (${Math.round(TOTAL_DURATION - landingConfig.dur)}s)`;
  sceneSelect.appendChild(optLand);

  sceneSelect.addEventListener("change", () => {
    jumpToShowTime(parseFloat(sceneSelect.value));
  });
}

document.querySelectorAll(".quick-jump").forEach(btn => {
  btn.addEventListener("click", () => {
    const idx = parseInt(btn.getAttribute("data-scene-idx"), 10);
    if (!isNaN(idx) && sceneStartTimes[idx] !== undefined) {
      if (sceneSelect) sceneSelect.value = String(sceneStartTimes[idx]);
      jumpToShowTime(sceneStartTimes[idx]);
    }
  });
});

if (btnPlay) {
  btnPlay.addEventListener("click", () => {
    isPaused = !isPaused;
    btnPlay.textContent = isPaused ? "Play" : "Pause";
  });
}

if (timeScrub) {
  timeScrub.addEventListener("input", () => {
    showState = "RUNNING";
    playheadTime = parseFloat(timeScrub.value);
    evaluateTimeline(playheadTime);
  });
}

if (btnExport) {
  btnExport.addEventListener("click", () => window.bakeAndDownloadGLB());
}

(async () => {
  await buildShowTrajectoryData();
  evaluateTimeline(0);
  if (hudStatus) hudStatus.textContent = "Ready — 19 Formations Loaded";
})();

renderer.xr.addEventListener("sessionstart", () => {
  document.body.classList.add("xr-active");
  renderer.xr.setFoveation(0.0);
  xrRig.position.set(0, 0, 38);
  xrRig.rotation.set(0, 0, 0);
});
renderer.xr.addEventListener("sessionend", () => {
  document.body.classList.remove("xr-active");
});

const SPRING = 11.5;
const DAMPING = 5.2;
const MAX_DRONE_SPEED = 14.5;

let prevTime = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - prevTime) / 1000);
  prevTime = now;

  if (!isPaused) {
    if (showState === "PRE_SHOW") {
      pauseCountdown -= dt;
      evaluateTimeline(0.0);
      if (pauseCountdown <= 0) {
        showState = "RUNNING";
        playheadTime = 0.0;
      }
    } else if (showState === "RUNNING") {
      playheadTime += dt;
      if (playheadTime >= TOTAL_DURATION) {
        playheadTime = TOTAL_DURATION;
        evaluateTimeline(TOTAL_DURATION);
        showState = "POST_SHOW";
        pauseCountdown = POST_SHOW_DELAY;
      } else {
        evaluateTimeline(playheadTime);
      }
    } else if (showState === "POST_SHOW") {
      pauseCountdown -= dt;
      evaluateTimeline(TOTAL_DURATION);
      if (pauseCountdown <= 0) {
        showState = "RUNNING";
        playheadTime = 0.0;
      }
    }
  } else {
    evaluateTimeline(playheadTime);
  }

  if (timeScrub && document.activeElement !== timeScrub) {
    timeScrub.value = String(playheadTime);
  }
  if (hudStatus && formationTrajectories.length === timelineData.formationBlocks.length && (!btnExport || !btnExport.disabled)) {
    hudStatus.textContent = `${activePhaseLabel} (${playheadTime.toFixed(1)}s / ${TOTAL_DURATION.toFixed(0)}s)`;
  }

  dronePoints.material.size = Math.max(0.02, BASE_DRONE_SIZE * stageGroup.scale.x);
  const formationCount = precipConfig.enabled ? Math.max(50, activeDroneCount - precipConfig.count) : activeDroneCount;
  const showBodyEnd = TOTAL_DURATION - landingConfig.dur;
  const inShowBody = (playheadTime > takeoffConfig.dur && playheadTime < showBodyEnd);

  for (let i = 0; i < activeDroneCount; i++) {
    const idx = i * 3;
    let px = currentPositions[idx], py = currentPositions[idx + 1], pz = currentPositions[idx + 2];
    let vx = velocities[idx], vy = velocities[idx + 1], vz = velocities[idx + 2];

    const fx = (targetPositions[idx] - px) * SPRING - vx * DAMPING;
    const fy = (targetPositions[idx + 1] - py) * SPRING - vy * DAMPING;
    const fz = (targetPositions[idx + 2] - pz) * SPRING - vz * DAMPING;

    vx += fx * dt; vy += fy * dt; vz += fz * dt;

    const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
    if (speed > MAX_DRONE_SPEED) {
      vx = (vx / speed) * MAX_DRONE_SPEED;
      vy = (vy / speed) * MAX_DRONE_SPEED;
      vz = (vz / speed) * MAX_DRONE_SPEED;
    }

    currentPositions[idx]     += vx * dt;
    currentPositions[idx + 1] += vy * dt;
    currentPositions[idx + 2] += vz * dt;
    velocities[idx] = vx; velocities[idx + 1] = vy; velocities[idx + 2] = vz;

    // Guarantee falling leaf drones are never visible while rising
    if (i >= formationCount && inShowBody && vy > -0.15) {
      isDroneVisible[i] = 0;
    }

    if (isDroneVisible[i] === 0) {
      currentColors[idx]     = 0.0;
      currentColors[idx + 1] = 0.0;
      currentColors[idx + 2] = 0.0;
    } else {
      currentColors[idx]     += (targetColors[idx] - currentColors[idx]) * Math.min(1.0, 7.0 * dt);
      currentColors[idx + 1] += (targetColors[idx + 1] - currentColors[idx + 1]) * Math.min(1.0, 7.0 * dt);
      currentColors[idx + 2] += (targetColors[idx + 2] - currentColors[idx + 2]) * Math.min(1.0, 7.0 * dt);
    }
  }

  droneGeometry.attributes.position.needsUpdate = true;
  droneGeometry.attributes.color.needsUpdate = true;

  if (!renderer.xr.isPresenting) orbit.update();
  renderer.render(scene, camera);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
